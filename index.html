        <a class="card" data-open-project="${esc(prev.id)}"><small>${ic('arrow-left')} Previous</small><strong>${esc(prev.title)}</strong></a>
        <a class="card r" data-open-project="${esc(next.id)}"><small>Next ${ic('arrow-right')}</small><strong>${esc(next.title)}</strong></a></div>` : ''}
    </article>`;
  }

  /** A file link the viewer can open: a web/Drive link, or an uploaded file kept inline (local preview). */
  const hasFile = u => !!(safeUrl(u) || /^data:/.test(String(u || '')));

  /** View + Download buttons that open the file on the website itself. */
  function fileButtons(url, name, labels) {
    const a = `data-url="${esc(url)}" data-name="${esc(name || '')}"`;
    return labels
      ? `${canView(name, url) ? `<button class="btn btn-ghost sm" data-fview ${a}>${ic('eye')} ${esc(labels)}</button>` : ''}<button class="btn btn-ghost sm" data-fdl ${a}>${ic('download')} Download</button>`
      : `${canView(name, url) ? `<button class="ib" data-fview ${a} title="View">${ic('eye')}</button>` : ''}<button class="ib" data-fdl ${a} title="Download">${ic('download')}</button>`;
  }

  function frame(b, src, label, iconName) {
    return `<figure class="b-embed card"><div class="b-embed-bar">${ic(iconName)}<span>${esc(b.title || label)}</span>
      <a href="${esc(src)}" target="_blank" rel="noopener">Open ${ic('external')}</a></div>
      <div class="b-frame" style="height:${Math.max(240, Math.min(1400, +b.height || 520))}px"><iframe src="${esc(src)}" loading="lazy" allowfullscreen frameborder="0"></iframe></div></figure>`;
  }

  function renderBlock(b, ctx) {
    const ph = (icon, msg) => ctx.admin ? `<div class="ph">${ic(icon)}<span>${msg}</span></div>` : '';
    switch (b.type) {
      case 'heading': return b.level == 3 ? `<h3 class="b-h3">${inline(b.text)}</h3>` : `<h2 class="b-h2">${inline(b.text)}</h2>`;
      case 'text': return `<div class="md b-text">${md(b.body)}</div>`;
      case 'callout': {
        const k = { insight: 'bulb', success: 'check', warning: 'alert', note: 'info' }[b.style] || 'bulb';
        return `<div class="b-callout k-${esc(b.style || 'insight')}"><div class="ci">${ic(k)}</div><div>${b.title ? `<strong>${esc(b.title)}</strong>` : ''}<div class="md">${md(b.body)}</div></div></div>`;
      }
      case 'kpis': return `<div class="b-kpis">${(b.items || []).map(k => `<div class="card kpi"><small>${esc(k.label)}</small><strong>${esc(k.value)}</strong>${k.delta ? `<em class="${/^-|▼/.test(k.delta) ? 'neg' : ''}">${esc(k.delta)}</em>` : ''}</div>`).join('')}</div>`;
      case 'powerbi': {
        const src = safeUrl(b.url);
        return src ? frame(b, src, 'Power BI report', 'chart') : ph('chart', 'Paste your Power BI “Publish to web” or embed link');
      }
      case 'embed': {
        const src = preview(b.url);
        return src ? frame(b, src, 'Embedded content', 'frame') : ph('frame', 'Paste a Tableau Public, Excel Online, Google Sheets or Looker Studio link');
      }
      case 'image': {
        const src = img(b.url);
        return src ? `<figure class="b-img ${b.wide ? 'wide' : ''}"><img src="${esc(src)}" alt="${esc(b.caption || '')}" loading="lazy" data-lightbox="${esc(src)}">${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>` : ph('image', 'Upload an image or paste a link');
      }
      case 'pages': {
        // Power BI style: tabs for each report page, one big screenshot, previous / next
        const items = (b.items || []).filter(x => img(x.url));
        if (!items.length) return ph('layout', 'Upload a screenshot of each dashboard page (Overview, Forecast, Air quality…)');
        return `<div class="b-pages card" data-pages>
          ${items.length > 1 ? `<div class="pg-tabs">${items.map((x, k) => `<button class="pg-tab ${k ? '' : 'on'}" data-pg="${k}">${esc(x.title || 'Page ' + (k + 1))}</button>`).join('')}</div>` : ''}
          <div class="pg-stage">${items.map((x, k) => `<figure class="pg-page ${k ? '' : 'on'}"><img src="${esc(img(x.url))}" alt="${esc(x.title || '')}" loading="lazy" data-lightbox="${esc(img(x.url))}">
            ${x.caption ? `<figcaption>${esc(x.caption)}</figcaption>` : ''}</figure>`).join('')}
            ${items.length > 1 ? `<button class="pg-nav prev" data-pgstep="-1" aria-label="Previous page">${ic('arrow-left')}</button><button class="pg-nav next" data-pgstep="1" aria-label="Next page">${ic('arrow-right')}</button>` : ''}</div>
          ${items.length > 1 ? `<div class="pg-count"><span data-pgnum>1</span> / ${items.length}</div>` : ''}</div>`;
      }
      case 'gallery': {
        const items = (b.items || []).filter(x => img(x.url));
        // a single image (or fewer images than columns) fills the width instead of leaving gaps
        const cols = Math.min(items.length, Math.min(4, Math.max(1, +b.cols || 3)));
        return items.length ? `<div class="b-gal" style="--cols:${cols}">${items.map(x => `<figure><img src="${esc(img(x.url))}" alt="${esc(x.caption || '')}" loading="lazy" data-lightbox="${esc(img(x.url))}">${x.caption ? `<figcaption>${esc(x.caption)}</figcaption>` : ''}</figure>`).join('')}</div>` : ph('gallery', 'Add images to the gallery');
      }
      case 'video': {
        const v = video(b.url);
        if (!v || !v.src) return ph('video', 'Paste a YouTube, Vimeo, Loom or Drive link — or upload a video');
        return `<figure class="b-video">${v.kind === 'video' ? `<video src="${esc(v.src)}" controls preload="metadata"></video>` : `<div class="ratio"><iframe src="${esc(v.src)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen loading="lazy" frameborder="0"></iframe></div>`}${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>`;
      }
      case 'file': {
        const items = (b.items || []).filter(f => ctx.admin || hasFile(f.url));
        if (!items.length) return ph('file', 'Add files: .pbix, .xlsx, .py, .ipynb, .sql, .pdf…');
        return `<div class="b-files">${items.map(f => {
          const m = fileMeta(f.name || f.url), has = hasFile(f.url);
          return `<div class="card fcard"><div class="fic" style="--fc:${m.color}">${ic(m.icon)}<b>${esc(m.ext.slice(0, 5))}</b></div>
            <div class="fmeta"><strong>${esc(f.name || 'Untitled file')}</strong><small class="fnote">${esc(f.note || m.label + ' file')}</small>
              ${String(f.note || '').length > 120 ? '<button class="fmore" data-fmore>Show more</button>' : ''}</div>
            <div class="fact-btns">${has ? fileButtons(f.url, f.name) : `<span class="ph-mini">Add a file</span>`}</div></div>`;
        }).join('')}</div>`;
      }
      case 'code': {
        const lang = /^(python|sql|r|javascript|bash|json)$/.test(b.language) ? b.language : 'none';
        return `<div class="b-code"><div class="b-code-bar"><span class="dots"><i></i><i></i><i></i></span><span>${esc(b.title || b.language || 'code')}</span><button data-copy>${ic('copy')} Copy</button></div>
          <pre class="language-${lang}"><code class="language-${lang}">${esc(b.code)}</code></pre>
          ${b.output ? `<div class="b-out"><small>Output</small><pre>${esc(b.output)}</pre></div>` : ''}</div>`;
      }
      case 'chart': {
        const svg = chartSvg(b.csv, b.chart);
        return svg ? `<figure class="card b-chart">${b.title ? `<figcaption class="t">${esc(b.title)}</figcaption>` : ''}${svg}${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>` : ph('line', 'Paste CSV data: first row = headers, first column = labels');
      }
      case 'table': return `<figure class="b-table">${tableHtml(b.csv)}${b.caption ? `<figcaption>${esc(b.caption)}</figcaption>` : ''}</figure>`;
      case 'links': {
        const items = (b.items || []).filter(l => l.label && safeUrl(l.url));
        return items.length ? `<div class="row">${items.map((l, i) => `<a class="btn ${i ? 'btn-ghost' : 'btn-primary'}" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener">${esc(l.label)} ${ic('external')}</a>`).join('')}</div>` : ph('link', 'Add button labels and links');
      }
      case 'divider': return '<hr class="b-hr">';
    }
    return '';
  }

  /* ---------------- server API (real or local mock) ---------------- */
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  const MOCK = {
    _data() { const s = store.get('ps_mock_data'); return s ? JSON.parse(s) : clone(DEFAULTS); },
    _msgs() { return JSON.parse(store.get('ps_mock_msgs') || '[]'); },
    login(pw) { if (pw !== (store.get('ps_mock_pw') || 'admin')) throw new Error('Incorrect password. (Local preview password: admin)'); return { token: 'mock', data: MOCK._data(), links: {} }; },
    getAdminData() { return { data: MOCK._data(), links: {} }; },
    logout() { return true; },
    saveData(t, d) {
      const prev = store.get('ps_mock_data'), b = JSON.parse(store.get('ps_mock_backups') || '[]');
      if (prev) { b.unshift({ id: 'B' + Date.now(), date: new Date().toISOString(), size: prev.length, data: prev }); store.set('ps_mock_backups', JSON.stringify(b.slice(0, 10))); }
      store.set('ps_mock_data', JSON.stringify(d));
      return { ok: true };
    },
    getBackups() { return JSON.parse(store.get('ps_mock_backups') || '[]').map(x => ({ id: x.id, date: x.date, size: x.size })); },
    restoreBackup(t, id) {
      const x = JSON.parse(store.get('ps_mock_backups') || '[]').find(b => b.id === id);
      if (!x) throw new Error('That is not one of your portfolio backups.');
      MOCK.saveData(t, JSON.parse(x.data));
      return { data: MOCK._data() };
    },
    uploadFile(t, f) { return { name: f.name, url: `data:${f.type || 'application/octet-stream'};base64,${f.data}` }; },
    submitContact(m) { const a = MOCK._msgs(); a.unshift(Object.assign({ id: 'M' + Date.now(), date: new Date().toISOString(), status: 'New' }, m)); store.set('ps_mock_msgs', JSON.stringify(a)); return { ok: true }; },
    getMessages() { return { messages: MOCK._msgs(), stats: { site: 128, projects: { p_retail: 41, p_churn: 23 } } }; },
    setMessageStatus(t, id, st) { const a = MOCK._msgs(); a.forEach(m => { if (m.id === id) m.status = st; }); store.set('ps_mock_msgs', JSON.stringify(a)); return true; },
    changePassword(t, o, n) { if (o !== (store.get('ps_mock_pw') || 'admin')) throw new Error('Current password is incorrect.'); store.set('ps_mock_pw', n); return true; },
    trackView() { return true; },
    getFileData() { throw new Error('the local preview can only open files uploaded in Studio'); },
    requestPasswordReset() { const c = String(Math.floor(100000 + Math.random() * 900000)); store.set('ps_mock_otp', c); toast('Local preview: your code is ' + c); return { sentTo: 'y•••••@example.com', minutes: 10 }; },
    resetPasswordWithOtp(code, pw) {
      if (!store.get('ps_mock_otp')) throw new Error('This code has expired. Ask for a new one.');
      if (String(code).trim() !== store.get('ps_mock_otp')) throw new Error('That code is not right.');
      if (String(pw || '').length < 8) throw new Error('New password must be at least 8 characters.');
      store.del('ps_mock_otp'); store.set('ps_mock_pw', pw);
      return { token: 'mock', data: MOCK._data(), links: {} };
    }
  };
  function call(fn, ...args) {
    // Hosted outside Apps Script (e.g. GitHub Pages): talk to the web app's JSON API
    if (!HAS_GAS && API) {
      return fetch(API, { method: 'POST', body: JSON.stringify({ fn, args }), keepalive: fn === 'logout' })
        .then(r => r.json())
        .then(r => { if (!r.ok) throw new Error(r.error || 'Request failed'); return r.result; });
    }
    if (!HAS_GAS) return new Promise((res, rej) => setTimeout(() => { try { res(MOCK[fn](...args)); } catch (e) { rej(e); } }, 250));
    return new Promise((res, rej) => {
      google.script.run.withSuccessHandler(res)
        .withFailureHandler(e => rej(e instanceof Error ? e : new Error((e && e.message) || String(e))))[fn](...args);
    });
  }

  /* ---------------- toasts, overlays ---------------- */
  function toast(msg, kind = '') {
    const box = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + kind;
    el.innerHTML = `${ic(kind === 'err' ? 'alert' : kind === 'ok' ? 'check' : 'info')}<span>${esc(msg)}</span>`;
    box.appendChild(el);
    setTimeout(() => el.classList.add('out'), kind === 'err' ? 5200 : 2800);
    setTimeout(() => el.remove(), kind === 'err' ? 5600 : 3200);
  }
  function overlay(inner, cls = '') {
    const el = document.createElement('div');
    el.className = 'ovl ' + cls;
    el.innerHTML = `<button class="ovl-x" aria-label="Close">${ic('x')}</button>${inner}`;
    const close = () => { el.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    el.addEventListener('click', e => { if (e.target === el || e.target.closest('.ovl-x')) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(el);
    return el;
  }

  /* ---------------- on-site file viewer & download (visitors never leave for Google Drive) ---------------- */
  const fileCache = new Map();
  const VIEW = {
    image: ['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'],
    pdf: ['pdf'],
    sheet: ['xlsx', 'xlsm', 'xls', 'csv', 'tsv', 'ods'],
    code: ['py', 'sql', 'r', 'txt', 'json', 'md', 'dax', 'm', 'js', 'css', 'xml', 'yaml', 'yml', 'log'],
    notebook: ['ipynb'],
    video: ['mp4', 'webm', 'ogg', 'mov']
  };
  const extOf = n => (String(n || '').toLowerCase().match(/\.([a-z0-9]+)(?:$|\?)/) || [])[1] || '';
  function viewKind(name, type) {
    const e = extOf(name);
    for (const k in VIEW) if (VIEW[k].includes(e)) return k;
    type = String(type || '');
    if (/^image[/]/.test(type)) return 'image';
    if (/pdf/.test(type)) return 'pdf';
    if (/^video[/]/.test(type)) return 'video';
    if (/^text[/]|json/.test(type)) return 'code';
    return '';
  }
  const b64ToBytes = b64 => { const s = atob(b64), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
  const blobOf = f => new Blob([f.bytes], { type: f.type || 'application/octet-stream' });
  const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';

  /** Gets a file's bytes: uploads and Drive links through the server, other links directly. */
  async function fetchFile(url, name) {
    if (fileCache.has(url)) return fileCache.get(url);
    let out;
    const id = driveId(url);
    if (/^data:/.test(url)) {
      const m = url.match(/^data:([^;,]*)(;base64)?,(.*)$/);
      out = { name: name || 'file', type: m[1] || 'application/octet-stream', bytes: m[2] ? b64ToBytes(m[3]) : new TextEncoder().encode(decodeURIComponent(m[3])) };
    } else if (id) {
      const r = await call('getFileData', id, PS.adminToken || '');
      out = { name: name && extOf(name) ? name : r.name, type: r.type, bytes: b64ToBytes(r.data) };
    } else {
      const res = await fetch(url);
      if (!res.ok) throw new Error('the link answered ' + res.status);
      out = { name: name && extOf(name) ? name : decodeURIComponent(url.split('?')[0].split('/').pop() || 'file'), type: res.headers.get('content-type') || '', bytes: new Uint8Array(await res.arrayBuffer()) };
    }
    if (out.bytes.length < 15 * 1048576) fileCache.set(url, out);
    return out;
  }
  function saveBytes(f) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blobOf(f));
    a.download = f.name || 'download';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  }
  const fileProblem = ex => /TOO_LARGE/.test(String(ex && ex.message)) ? 'This file is too large to open on the website.' : 'This file could not be opened (' + String((ex && ex.message) || ex).replace(/^Exception: /, '') + ').';
  async function downloadFile(url, name) {
    toast('Preparing download…');
    try { saveBytes(await fetchFile(url, name)); } catch (ex) { toast(fileProblem(ex), 'err'); }
  }

  async function viewFile(url, name) {
    const m = fileMeta(name || url);
    const box = overlay(`<div class="fv"><div class="fv-h"><div class="fic" style="--fc:${m.color}">${ic(m.icon)}<b>${esc(m.ext.slice(0, 5))}</b></div>
      <div class="fv-t"><strong>${esc(name || 'File')}</strong><small>Loading…</small></div>
      <button class="fv-dl" disabled>${ic('download')} <span>Download</span></button></div>
      <div class="fv-b"><div class="boot-loader"><span></span></div></div></div>`, 'fvo');
    const body = $('.fv-b', box), title = $('.fv-t strong', box), sub = $('.fv-t small', box), dl = $('.fv-dl', box);
    let f;
    try { f = await fetchFile(url, name); }
    catch (ex) { body.innerHTML = `<div class="fv-msg">${ic('alert')}<p>${esc(fileProblem(ex))}</p></div>`; sub.textContent = ''; return; }
    const meta = fileMeta(f.name);
    title.textContent = f.name;
    sub.textContent = fmtSize(f.bytes.length) + ' · ' + meta.label;
    dl.disabled = false; dl.onclick = () => saveBytes(f);
    try {
      switch (viewKind(f.name, f.type)) {
        case 'image': body.innerHTML = `<img class="fv-img" src="${URL.createObjectURL(blobOf(f))}" alt="">`; break;
        case 'video': body.innerHTML = `<video class="fv-video" src="${URL.createObjectURL(blobOf(f))}" controls autoplay></video>`; break;
        case 'pdf': await showPdf(body, f); break;
        case 'sheet': await showSheet(body, f); break;
        case 'notebook': showNotebook(body, f); break;
        case 'code': showText(body, new TextDecoder().decode(f.bytes), extOf(f.name)); break;
        default:
          body.innerHTML = `<div class="fv-msg">${ic(meta.icon)}<p><b>${esc(meta.label)}</b> files can't be shown in a browser.<br>Download it to open it on your computer.</p>
            <button class="btn btn-primary" data-fv-dl>${ic('download')} Download ${esc(f.name)}</button></div>`;
          $('[data-fv-dl]', body).onclick = () => saveBytes(f);
      }
    } catch (ex) {
      body.innerHTML = `<div class="fv-msg">${ic('alert')}<p>The preview could not be shown (${esc(ex.message)}). You can still download the file.</p></div>`;
    }
  }

  async function showPdf(body, f) {
    await loadAsset(CDN + 'pdf.js/3.11.174/pdf.min.js');
    const lib = window.pdfjsLib;
    lib.GlobalWorkerOptions.workerSrc = CDN + 'pdf.js/3.11.174/pdf.worker.min.js';
    const pdf = await lib.getDocument({ data: f.bytes.slice() }).promise;
    body.innerHTML = '<div class="fv-pdf"></div>';
    const wrap = $('.fv-pdf', body), width = Math.min(body.clientWidth - 32, 980), pages = Math.min(pdf.numPages, 60);
    for (let i = 1; i <= pages; i++) {
      if (!body.isConnected) return;
      const page = await pdf.getPage(i);
      const scale = width / page.getViewport({ scale: 1 }).width, vp = page.getViewport({ scale: scale * (window.devicePixelRatio || 1) });
      const c = document.createElement('canvas');
      c.width = vp.width; c.height = vp.height; c.style.width = width + 'px';
      wrap.appendChild(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
    if (pdf.numPages > pages) wrap.insertAdjacentHTML('beforeend', `<p class="fv-note">Showing the first ${pages} of ${pdf.numPages} pages. Download for the full document.</p>`);
  }

  async function showSheet(body, f) {
    let sheets;
    if (/^(csv|tsv)$/.test(extOf(f.name))) sheets = [{ name: f.name, rows: parseCSV(new TextDecoder().decode(f.bytes)) }];
    else {
      await loadAsset(CDN + 'xlsx/0.18.5/xlsx.full.min.js');
      const wb = XLSX.read(f.bytes, { type: 'array' });
      sheets = wb.SheetNames.map(n => ({ name: n, rows: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }) }));
    }
    body.innerHTML = `${sheets.length > 1 ? `<div class="fv-tabs">${sheets.map((s, i) => `<button class="fv-tab" data-i="${i}">${esc(s.name)}</button>`).join('')}</div>` : ''}<div class="fv-sheet"></div>`;
    const draw = i => {
      const all = sheets[i].rows, rows = all.slice(0, 1000).map(r => r.slice(0, 60));
      $('.fv-sheet', body).innerHTML = rows.length

        if (form.pw1.value.length < 8) { err.textContent = 'New password must be at least 8 characters.'; return; }
        if (form.pw1.value !== form.pw2.value) { err.textContent = 'The two passwords do not match.'; return; }
      }
      btn.disabled = true;
      try {
        if (step === 'login') signedIn(await call('login', form.pw.value));
        else if (step === 'forgot') { const r = await call('requestPasswordReset'); sentTo = r.sentTo; render('otp'); }
        else { const r = await call('resetPasswordWithOtp', form.code.value.trim(), form.pw1.value); toast('Password changed — you are signed in', 'ok'); signedIn(r); }
      } catch (ex) { err.textContent = ex.message; btn.disabled = false; }
    });
    render('login');
  }

  function boot(token, r) {

    S.previewMode = PS.resolveMode(S.data.settings.theme);

    d.profile = Object.assign({}, clone(D.profile), d.profile || {});

  /** A block with nothing to show yet (it is hidden on the public site). */
  function isEmptyBlock(b) {
    switch (b.type) {
      case 'powerbi': case 'embed': case 'video': case 'image': return !b.url;
      case 'gallery': case 'pages': case 'file': case 'links': return !(b.items || []).some(x => x.url);
      case 'kpis': return !(b.items || []).length;
      case 'text': return !String(b.body || '').trim();
      default: return false;
    }
  }
  /** Things worth fixing before recruiters see a project. */
  function projectIssues(pr) {
    const out = new Set(), bl = pr.blocks || [], placeholder = /^(metric|impact metric|kpi)$/i;
    if (!String(pr.title || '').trim() || /^new /i.test(pr.title)) out.add('Give the project a real title');
    if (!pr.summary || /One-line summary/.test(pr.summary)) out.add('Write a one-line summary for the project card');
    if (!pr.cover) out.add('Add a cover image (a dashboard screenshot works well)');
    if ((pr.metrics || []).some(m => placeholder.test(String(m.label).trim()) || /^0%?$/.test(String(m.value).trim()))) out.add('Headline metrics still have placeholder values ("0%", "Impact metric")');
    bl.forEach((b, k) => {
      if (b.type === 'kpis' && (b.items || []).some(x => placeholder.test(String(x.label).trim()))) out.add('A KPI cards block still says "Metric"');
      if (b.type === 'text' && /Write your story here/.test(b.body || '')) out.add('A text block still has the sample text');
      if (b.type === 'callout' && /What did the data reveal/.test(b.body || '')) out.add('An insight block still has the sample text');
      if ((b.type === 'gallery' || b.type === 'pages') && isEmptyBlock(b)) out.add(`The ${BLOCK_TYPES[b.type].label.replace(/ \(.*\)/, '')} block has no images yet (hidden on your site)`);
      if (b.type === 'powerbi' && !b.url) out.add('The Power BI block has no link yet (hidden on your site)');
      if (b.type === 'file') (b.items || []).forEach(f => {
        if (!f.url) out.add(`File "${f.name || 'untitled'}" has no upload yet (hidden on your site)`);
        else if (String(f.note || '').length > 160) out.add(`Shorten the description of "${f.name}" to one line`);
      });
      if (b.type === 'heading') {
        let j = k + 1;
        while (j < bl.length && isEmptyBlock(bl[j])) j++;
        if (j >= bl.length || bl[j].type === 'heading') out.add(`Heading "${b.text}" has nothing under it (hidden on your site)`);
      }
    });
    return [...out];
  }

    return `<div class="p-h"><h2>Projects</h2><span class="pill">${S.data.projects.length}</span></div><p class="p-sub">Drag to reorder · ★ to feature · click to edit.</p>

  function blockSummary(b) {
    switch (b.type) {

      case 'kpis': case 'gallery': case 'links': return (b.items || []).length + ' items';
      case 'chart': return (b.chart || 'bar') + ' chart · ' + (b.title || '');

        F.area('Code', p + '.code', 12, '', '', 'mono') + F.area('Output (optional)', p + '.output', 3, 'Printed result, model score…', '', 'mono');

    const views = Object.entries(st.projects || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);

      <div class="seg" style="margin-bottom:12px">${['All', 'New', 'Read', 'Replied', 'Archived'].map(f => `<button class="${S.inboxFilter === f ? 'on' : ''}" data-act="inbox-filter" data-v="${f}">${f}</button>`).join('')}</div>
      ${msgs.length ? msgs.map(m => `<div class="msg ${m.status === 'New' ? 'new' : ''}"><div class="msg-h"><strong>${esc(m.name)}</strong><span class="pill ${esc(m.status)}">${esc(m.status)}</span></div>
        <div class="meta">${esc(m.email)}${m.phone ? ' · ' + esc(m.phone) : ''}${m.company ? ' · ' + esc(m.company) : ''}<br>${esc(new Date(m.date).toLocaleString())}</div>
        ${m.subject ? `<div style="margin-top:6px;font-weight:600;font-size:13px">${esc(m.subject)}</div>` : ''}<p>${esc(m.message)}</p>
        <div class="acts"><a class="btn2" href="mailto:${esc(m.email)}?subject=${encodeURIComponent('Re: ' + (m.subject || 'Your message'))}" target="_blank" data-act="msg-status" data-id="${esc(m.id)}" data-v="Replied">${ic('send')} Reply</a>
        ${m.status === 'New' ? `<button class="btn2" data-act="msg-status" data-id="${esc(m.id)}" data-v="Read">${ic('check')} Mark read</button>` : ''}
        ${m.status !== 'Archived' ? `<button class="btn2" data-act="msg-status" data-id="${esc(m.id)}" data-v="Archived">Archive</button>` : ''}</div></div>`).join('')
        : `<div class="hint" style="text-align:center;padding:30px">${ic('inbox')}<br>No ${S.inboxFilter === 'All' ? '' : S.inboxFilter.toLowerCase() + ' '}messages yet.</div>`}`;

  async function loadInbox() {
    if (S.inboxLoading) return;
    S.inboxLoading = true;
    try { S.inbox = await call('getMessages', S.token); updateBadge(); if (S.tab === 'inbox' && !S.edit) renderPanel(); }
    catch (e) { handleErr(e); }
    finally { S.inboxLoading = false; }
  }

  /* ---------------- sortable (drag & drop) ---------------- */
  function initSortables() {
    if (!window.Sortable) {
      PS.loadAsset(PS.CDN + 'Sortable/1.15.0/Sortable.min.js').then(() => { if (window.Sortable) initSortables(); }).catch(() => {});
      return;
    }
    $$('[data-sortable]', panel).forEach(el => {
      sortables.push(new Sortable(el, {
        handle: '.grip', animation: 160, ghostClass: 'sortable-ghost', draggable: '.it,.sub,.card2',
        onEnd: e => {
          if (e.oldIndex === e.newIndex) return;
          const a = arr(el.dataset.sortable);
          a.splice(e.newIndex, 0, a.splice(e.oldIndex, 1)[0]);
          touched(true); renderPanel(); renderPreview();
        }
      }));
    });
  }

  /* ---------------- events ---------------- */
  function onInput(e) {
    const el = e.target, path = el.dataset.bind;
    if (!path) return;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.type === 'num') v = v === '' ? '' : +v;
    if (el.dataset.type === 'tags') v = String(v).split(',').map(x => x.trim()).filter(Boolean);
    if (/^settings\.theme\.(dark|light)\./.test(path)) set('settings.theme.preset', 'custom');
    set(path, v);
    $$(`[data-bind="${CSS.escape(path)}"]`, panel).forEach(x => { if (x !== el && x.type !== 'checkbox') x.value = el.value; });
    const out = $(`[data-out="${CSS.escape(path)}"]`, panel); if (out) out.textContent = el.value + (/radius|height/.test(path) ? 'px' : '');
    const thumb = el.closest('.media') && $('.thumb', el.closest('.media')); if (thumb) thumb.style.backgroundImage = el.value ? `url('${img(el.value)}')` : '';
    const cnt = el.maxLength > 0 && el.parentElement.querySelector('.cnt'); if (cnt) cnt.textContent = `${el.value.length}/${el.maxLength} characters`;
    if (el.closest('.f.miss') && el.value.trim()) { el.closest('.f').classList.remove('miss'); const r = el.parentElement.querySelector('.req'); if (r) r.remove(); }
    touched();
    // "I currently work here" switches the end date to Present
    if (/\.current$/.test(path) && e.type === 'change') { commit(); renderPanel(); }
  }

  function onKey(e) {
    const mod = e.ctrlKey || e.metaKey, typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    else if (mod && !typing && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (mod && !typing && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  }

  const ACT = {
    tab: el => { commit(); S.tab = el.dataset.v; S.edit = null; S.view = null; if (S.tab === 'inbox') S.inbox = S.inbox || null; renderPanel(); renderPreview(); },
    back: () => { commit(); const wasProj = S.edit && S.edit.kind === 'project'; S.edit = null; if (wasProj) S.view = null; renderPanel(); renderPreview(); },
    undo, redo,
    save: () => save(),
    device: el => { S.device = el.dataset.v; $('#frame').className = 'st-frame ' + S.device; $$('[data-act=device]').forEach(b => b.classList.toggle('on', b === el)); },
    'preview-only': el => { S.previewOnly = !S.previewOnly; $('.studio').classList.toggle('preview-only', S.previewOnly); el.classList.toggle('on', S.previewOnly); },
    logout: () => { if (S.last !== S.saved && !confirm('You have unpublished changes. Sign out anyway?')) return; call('logout', S.token).catch(() => {}); S.token = PS.adminToken = null; location.reload(); },
    set: el => {
      set(el.dataset.path, el.dataset.v);
      if (el.dataset.path === 'settings.theme.mode') S.previewMode = PS.resolveMode(S.data.settings.theme);
      touched(true); renderPanel();
    },
    preset: el => { const p = PRESETS[el.dataset.v]; Object.assign(S.data.settings.theme, { preset: el.dataset.v, dark: clone(p.dark), light: clone(p.light) }); touched(true); renderPanel(); },
    pmode: el => { S.previewMode = el.dataset.v; renderPanel(); renderPreview(); },
    upload: el => upload(el.dataset.path, el.dataset.accept, el.dataset.name),
    'quick-img': () => quickUpload('image'),
    'quick-file': () => quickUpload('file'),

    'edit-sec': el => { commit(); S.tab = 'sections'; S.edit = { kind: 'section', id: el.dataset.id }; S.view = null; renderPanel(); renderPreview(); scrollPreviewTo($(`[data-sec="${CSS.escape(el.dataset.id)}"]`, preview)); },
    'sec-vis': el => { const s = S.data.sections[secIdx(el.dataset.id)]; s.visible = s.visible === false; touched(true); renderPanel(); },
    'sec-add': el => {
      const type = el.dataset.v, s = Object.assign({ id: uid('s'), type, visible: true }, SECTION_TYPES[type].make());
      const ci = S.data.sections.findIndex(x => x.type === 'contact');
      S.data.sections.splice(ci >= 0 && type !== 'contact' ? ci : S.data.sections.length, 0, s);
      S.edit = { kind: 'section', id: s.id }; touched(true); renderPanel(); renderPreview();
      setTimeout(() => scrollPreviewTo($(`[data-sec="${s.id}"]`, preview)), 50);
    },
    'sec-dup': el => { const i = secIdx(el.dataset.id), c = clone(S.data.sections[i]); c.id = uid('s'); c.title = (c.title || '') + ' (copy)'; S.data.sections.splice(i + 1, 0, c); S.edit = { kind: 'section', id: c.id }; touched(true); renderPanel(); renderPreview(); },
    'sec-del': el => { const i = secIdx(el.dataset.id); if (!confirm(`Delete the “${S.data.sections[i].title}” section? (You can undo.)`)) return; S.data.sections.splice(i, 1); S.edit = null; touched(true); renderPanel(); renderPreview(); toast('Section deleted — Ctrl+Z to undo'); },

    'edit-proj': el => { commit(); S.tab = 'projects'; S.edit = { kind: 'project', id: el.dataset.id }; S.view = el.dataset.id; renderPanel(); renderPreview(); canvas.scrollTop = 0; },
    'proj-feat': el => { const p = S.data.projects[projIdx(el.dataset.id)]; p.featured = !p.featured; touched(true); renderPanel(); },
    'proj-vis': el => { const p = S.data.projects[projIdx(el.dataset.id)]; p.visible = p.visible === false; touched(true); renderPanel(); },
    'proj-new': el => {
      const t = TEMPLATES[el.dataset.v];
      const p = { id: uid('p'), title: 'New ' + t.label.toLowerCase(), summary: 'One-line summary of what you did and the impact it had.', category: t.category, tools: t.tools.slice(), date: String(new Date().getFullYear()), cover: '', visible: true, featured: false, links: {}, metrics: [{ value: '0%', label: 'Impact metric' }], blocks: t.blocks.map(([type, over]) => Object.assign(newBlock(type), clone(over))) };
      S.data.projects.unshift(p);
      S.edit = { kind: 'project', id: p.id }; S.view = p.id; S.open = new Set([p.blocks[0] && p.blocks[0].id]);
      touched(true); renderPanel(); renderPreview(); canvas.scrollTop = 0; toast('Project created from template', 'ok');
    },
    'proj-dup': el => { const i = projIdx(el.dataset.id), c = clone(S.data.projects[i]); c.id = uid('p'); c.title += ' (copy)'; c.blocks.forEach(b => { b.id = uid('b'); }); S.data.projects.splice(i + 1, 0, c); S.edit = { kind: 'project', id: c.id }; S.view = c.id; touched(true); renderPanel(); renderPreview(); },
    'proj-del': el => { const i = projIdx(el.dataset.id); if (!confirm(`Delete “${S.data.projects[i].title}”? (You can undo.)`)) return; S.data.projects.splice(i, 1); S.edit = null; S.view = null; touched(true); renderPanel(); renderPreview(); toast('Project deleted — Ctrl+Z to undo'); },

    toggle: (el, e) => {
      const btn = e.target.closest('button');
      if (e.target.closest('.grip') || (btn && btn !== el)) return;
      const id = el.dataset.id;
      S.open.has(id) ? S.open.delete(id) : S.open.add(id);
      commit(); renderPanel();
    },
    'entry-add': el => {
      const a = arr(el.dataset.path);
      a.push({});
      S.open.add(`e:${el.dataset.sec}:${a.length - 1}`);
      touched(true); renderPanel();
      setTimeout(() => flashCard(`e:${el.dataset.sec}:${a.length - 1}`), 50);
    },
    'entry-del': el => {
      const [p, i] = splitPath(el.dataset.path), it = arr(p)[i] || {};
      if (!confirm(`Delete “${it.title || it.name || it.org || 'this entry'}”? You can undo with Ctrl+Z until you publish.`)) return;
      arr(p).splice(i, 1);
      S.open = new Set([...S.open].filter(k => !k.startsWith('e:')));
      touched(true); renderPanel(); toast('Entry deleted. Ctrl+Z to undo');
    },
    'pages-upload': el => {
      const p = el.dataset.path;
      pickFiles('image/\*', true, async files => {
        arr(p).splice(0, arr(p).length, ...arr(p).filter(x => x.url));
        let n = 0;
        for (const f of files) {
          toast(`Uploading ${f.name} (${++n} of ${files.length})…`);
          try { arr(p).push({ url: await sendFile(f), title: f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '), caption: '' }); touched(true); renderPanel(); renderPreview(); }
          catch (ex) { handleErr(ex); }
        }
        toast(`${files.length} page${files.length > 1 ? 's' : ''} added. Rename them if needed`, 'ok');
      });
    },
    'add-skill': el => { const a = arr(el.dataset.path); if (!a.includes(el.dataset.v)) a.push(el.dataset.v); touched(true); renderPanel(); },
    'media-upload': el => {
      const p = el.dataset.path;
      pickFiles('', true, async files => {
        let n = 0;
        for (const f of files) {
          toast(`Uploading ${f.name} (${++n} of ${files.length})…`);
          try { arr(p).push({ url: await sendFile(f), name: f.name, title: f.name.replace(/\.[^.]+$/, ''), desc: '' }); touched(true); renderPanel(); }
          catch (ex) { handleErr(ex); }
        }
        toast(`${files.length} media item${files.length > 1 ? 's' : ''} added`, 'ok');
      });
    },
    'blk-all': () => { const p = S.data.projects[projIdx(S.edit.id)]; S.open = S.open.size ? new Set() : new Set(p.blocks.map(b => b.id)); renderPanel(); },
    'blk-add': el => {
      const p = S.data.projects[projIdx(S.edit.id)], b = newBlock(el.dataset.v);
      p.blocks.push(b); S.open.add(b.id); touched(true); renderPanel(); renderPreview();
      setTimeout(() => { flashCard(b.id); scrollPreviewTo($(`[data-blk="${b.id}"]`, preview)); }, 60);
    },

    'list-add': el => { const a = arr(el.dataset.path); a.push(NEW[el.dataset.new]()); touched(true); renderPanel(); },
    'list-del': el => { const [p, i] = splitPath(el.dataset.path); arr(p).splice(i, 1); touched(true); renderPanel(); },
    'list-dup': el => { const [p, i] = splitPath(el.dataset.path), a = arr(p), c = clone(a[i]); if (c.id) { c.id = uid('b'); S.open.add(c.id); } a.splice(i + 1, 0, c); touched(true); renderPanel(); },
    'list-up': el => { const [p, i] = splitPath(el.dataset.path), a = arr(p); if (i > 0) { [a[i - 1], a[i]] = [a[i], a[i - 1]]; touched(true); renderPanel(); } },
    'list-down': el => { const [p, i] = splitPath(el.dataset.path), a = arr(p); if (i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; touched(true); renderPanel(); } },

    'inbox-refresh': () => { S.inbox = null; renderPanel(); },
    'inbox-filter': el => { S.inboxFilter = el.dataset.v; renderPanel(); },
    'msg-status': async (el, e) => {
      if (el.tagName !== 'A') e.preventDefault();
      const m = S.inbox.messages.find(x => x.id === el.dataset.id);
      if (!m) return;
      m.status = el.dataset.v; updateBadge(); setTimeout(renderPanel, 0);
      try { await call('setMessageStatus', S.token, m.id, m.status); } catch (ex) { handleErr(ex); }
    },
    'pw-change': async () => {
      try { await call('changePassword', S.token, $('#pw-old').value, $('#pw-new').value); $('#pw-old').value = $('#pw-new').value = ''; toast('Password updated', 'ok'); }
      catch (ex) { handleErr(ex); }
    },
    export: () => {
      commit();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(S.data, null, 2)], { type: 'application/json' }));
      a.download = 'portfolio-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click(); toast('Backup downloaded', 'ok');
    },
    import: () => {
      const inp = Object.assign(document.createElement('input'), { type: 'file', accept: '.json,application/json' });
      inp.onchange = async () => {
        try { const d = JSON.parse(await inp.files[0].text()); if (!d.profile || !d.sections) throw new Error('Not a portfolio backup file.'); S.data = normalize(d); touched(true); refreshAll(); toast('Imported — click Publish to go live', 'ok'); }
        catch (ex) { toast(ex.message, 'err'); }
      };
      inp.click();
    },
    reset: () => { if (!confirm('Replace everything with the demo content? (You can undo until you publish, and your current version stays in Version history.)')) return; S.data = normalize(clone(PS.DEFAULTS)); S.edit = null; S.view = null; touched(true); refreshAll(); },
    'backups-load': async () => {
      try { S.backups = await call('getBackups', S.token); renderPanel(); } catch (ex) { handleErr(ex); }
    },
    'backup-restore': async el => {
      const when = new Date(el.dataset.date).toLocaleString();
      if (S.last !== S.saved && !confirm('You have unpublished changes that will be replaced. Continue?')) return;
      if (!confirm(`Make the version from ${when} your live portfolio? Your current version is saved first, so you can switch back.`)) return;
      try {
        toast('Restoring…');
        const r = await call('restoreBackup', S.token, el.dataset.id);
        S.data = normalize(r.data);
        S.saved = S.last = JSON.stringify(S.data);
        S.hist = []; S.fut = []; S.backups = null;
        store.del('ps_draft');
        refreshAll(); toast('Restored. Your live site now shows that version', 'ok');
      } catch (ex) { handleErr(ex); }
    }
  };

  function onClick(e) {
    const el = e.target.closest('[data-act]');
    if (!el || !app.contains(el)) return;
    if (el.closest('#preview')) return;
    const fn = ACT[el.dataset.act];
    if (fn) fn(el, e);
  }

  /* ---------------- upload & save ---------------- */
  /** Sends one file from the computer to the portfolio's Drive folder and returns its link. */
  async function sendFile(f) {
    const max = PS.HAS_GAS || PS.API ? 25 : 3;
    if (f.size > max * 1048576) throw new Error(`${f.name} is over ${max} MB. Upload it to Google Drive and paste the share link instead.`);
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(f); });
    const out = await call('uploadFile', S.token, { name: f.name, type: f.type, data });
    return out.url;
  }
  function pickFiles(accept, multiple, cb) {
    const inp = Object.assign(document.createElement('input'), { type: 'file', accept: accept || '', multiple: !!multiple });
    inp.onchange = () => { if (inp.files.length) cb(Array.from(inp.files)); };
    inp.click();
  }
  function upload(path, accept, namePath) {
    pickFiles(accept, false, async ([f]) => {
      toast(`Uploading ${f.name}…`);
      try {
        set(path, await sendFile(f));
        if (namePath) set(namePath, f.name);
        touched(true); renderPanel(); toast('Uploaded ' + f.name, 'ok');
      } catch (ex) { handleErr(ex); }
    });
  }
  /** Project quick upload: several images go into the project's gallery, several files into its downloads. */
  function quickUpload(kind) {
    const pr = S.data.projects[projIdx(S.edit.id)];
    pickFiles(kind === 'image' ? 'image/\*' : '', true, async files => {
      let blk = pr.blocks.find(b => b.type === (kind === 'image' ? 'gallery' : 'file'));
      if (!blk) { blk = newBlock(kind === 'image' ? 'gallery' : 'file'); blk.items = []; pr.blocks.push(blk); }
      blk.items = (blk.items || []).filter(it => it.url);
      let done = 0;
      for (const f of files) {
        toast(`Uploading ${f.name} (${++done} of ${files.length})…`);
        try {
          const url = await sendFile(f);
          blk.items.push(kind === 'image' ? { url, caption: '' } : { name: f.name, url, note: '' });
          touched(true); renderPanel(); renderPreview();
        } catch (ex) { handleErr(ex); }
      }
      S.open.add(blk.id); renderPanel();
      setTimeout(() => { flashCard(blk.id); scrollPreviewTo($(`[data-blk="${blk.id}"]`, preview)); }, 80);
      toast(`${files.length} ${kind === 'image' ? 'image' : 'file'}${files.length > 1 ? 's' : ''} added`, 'ok');
    });
  }

  async function save() {
    if (S.saving) return;
    commit();
    S.saving = true; updateStatus();
    try {
      const r = await call('saveData', S.token, S.data);
      S.saved = S.last; S.pendingSave = false; S.backups = null;
      store.del('ps_draft');
      toast('Published — your live site is updated', 'ok');
    } catch (ex) {
      if (/SESSION_EXPIRED/.test(ex.message)) S.pendingSave = true;
      handleErr(ex);
    } finally { S.saving = false; updateStatus(); }
  }

  function handleErr(ex) {
    const msg = (ex && ex.message) || String(ex);
    if (/SESSION_EXPIRED/.test(msg)) { S.token = PS.adminToken = null; showLogin(true); return; }
    toast(msg.replace(/^Exception: /, ''), 'err');
  }
})();
</script>

  <script>PS.start();</script>
</body>
