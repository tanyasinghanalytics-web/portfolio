<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tanya Mall - Data Analyst Portfolio</title>
  <meta name="description" content="Data Analyst portfolio: Power BI, Excel, SQL and Python projects.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <style>
/* =====================================================================
   Global
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0b1020;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font:inherit;cursor:pointer}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.15em}
.boot-loader{min-height:100vh;display:grid;place-items:center}
.boot-loader span{width:42px;height:42px;border-radius:50%;border:3px solid #ffffff22;border-top-color:#7c5cff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* toasts & overlays */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:#111827;color:#f9fafb;padding:11px 16px;border-radius:12px;font:500 14px Inter,system-ui,sans-serif;box-shadow:0 12px 40px #0007;border:1px solid #ffffff1a;animation:tin .25s ease;max-width:92vw}
.toast.ok .ic{color:#34d399}.toast.err .ic{color:#f87171}
.toast.out{opacity:0;transform:translateY(8px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.ovl{position:fixed;inset:0;z-index:9000;background:#05070dcc;backdrop-filter:blur(6px);display:grid;place-items:center;padding:4vh 4vw;animation:tin .2s}
.ovl-x{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:#ffffff1a;color:#fff;display:grid;place-items:center}
.lb-img{max-height:90vh;max-width:92vw;border-radius:12px;box-shadow:0 20px 80px #000a}
.pv-frame{width:min(1100px,92vw);height:86vh;border:0;border-radius:12px;background:#fff}

/* =====================================================================
   SITE (public portfolio). Uses container queries so the Studio preview
   can emulate desktop / tablet / mobile.
   ===================================================================== */
.site{
  --border:color-mix(in srgb,var(--text) 11%,transparent);
  --soft:color-mix(in srgb,var(--text) 5%,transparent);
  --pri-soft:color-mix(in srgb,var(--primary) 16%,transparent);
  --shadow:0 18px 50px -20px color-mix(in srgb,#000 70%,transparent);
  container:site/inline-size;
  position:relative;min-height:100vh;overflow-x:clip;
  background:var(--bg);color:var(--text);font-family:var(--fb);font-size:16px;line-height:1.65;
}
.site.light{--shadow:0 18px 50px -24px #0f172a33}
.site a{color:inherit;text-decoration:none;cursor:pointer}
.site h1,.site h2,.site h3{font-family:var(--fh);line-height:1.15;margin:0;letter-spacing:-.02em}
.site p{margin:0}
.site .muted{color:var(--muted)}
.site .wrap{max-width:1160px;margin:0 auto;padding:0 28px;position:relative}
.site main{position:relative;z-index:1}
.site em{font-style:normal;background:linear-gradient(100deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.site .md em{font-style:italic;background:none;color:inherit}

/* background effects */
.bgfx{position:absolute;inset:0;height:1100px;pointer-events:none;z-index:0}
.bg-grid{background-image:linear-gradient(var(--soft) 1px,transparent 1px),linear-gradient(90deg,var(--soft) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0,#000 30%,transparent 75%)}
.bg-grid::after,.bg-glow::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 380px at 15% 8%,color-mix(in srgb,var(--primary) 26%,transparent),transparent 70%),radial-gradient(520px 360px at 85% 18%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%)}
.bg-dots{background-image:radial-gradient(var(--border) 1.2px,transparent 1.2px);background-size:22px 22px;mask-image:linear-gradient(#000,transparent 80%);-webkit-mask-image:linear-gradient(#000,transparent 80%)}

/* buttons, tags */
.site .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:calc(var(--radius) * .7 + 4px);font-weight:600;font-size:15px;border:1px solid transparent;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.site .btn.sm{padding:8px 14px;font-size:14px}
.site .btn.full{width:100%}
.site .btn-primary{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 55%,var(--accent)));color:#fff;box-shadow:0 10px 30px -10px var(--primary)}
.site .btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 34px -10px var(--primary)}
.site .btn-ghost{border-color:var(--border);background:var(--soft);color:var(--text)}
.site .btn-ghost:hover{border-color:color-mix(in srgb,var(--primary) 60%,transparent);background:var(--pri-soft)}
.site .btn:disabled{opacity:.6;pointer-events:none}
.site .row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.site .tags{display:flex;flex-wrap:wrap;gap:6px}
.site .tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--border);color:var(--muted)}
.site .tag.lg{font-size:13px;padding:6px 12px;color:var(--text)}
.site .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);margin-bottom:14px}
.site .eyebrow::before{content:"";width:22px;height:2px;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:2px}
.site .lnk{display:inline-flex;gap:6px;align-items:center;color:var(--primary);font-weight:600;font-size:14px;margin-top:10px}

/* cards — three styles */
.site .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.site.cs-glass .card{background:color-mix(in srgb,var(--surface) 84%,transparent)}
.site.cs-outline .card{background:transparent}
.site.cs-solid .card{box-shadow:var(--shadow)}

/* reveal animation */
.site.anim .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.site.anim .reveal.in{opacity:1;transform:none}

/* nav */
.nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-in{display:flex;align-items:center;gap:24px;height:68px}
.site .brand{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none;font-family:var(--fh);font-weight:700;font-size:17px}
.site .logo{width:36px;height:36px;border-radius:calc(var(--radius) * .5 + 4px);display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--primary),var(--accent));flex:none}
.site .logo.sm{width:40px;height:40px;border-radius:50%}
.nav-links{display:flex;gap:4px;margin-left:auto}
.nav-links a{padding:8px 12px;border-radius:10px;color:var(--muted);font-size:15px;font-weight:500;transition:.2s}
.nav-links a:hover{color:var(--text);background:var(--soft)}
.nav-cta{display:flex;align-items:center;gap:8px}
.site{transition:background-color .35s ease,color .35s ease}
.mode-btn{display:grid;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--soft);color:var(--text);place-items:center;transition:transform .3s,background .2s}
.mode-btn:hover{background:var(--pri-soft);transform:rotate(18deg)}
.burger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--soft);color:var(--text);place-items:center}
.nav-mobile{display:none}

/* sections */
.sec{padding:110px 0;position:relative}
.sec.tight{padding:30px 0}
.sec-head{max-width:720px;margin-bottom:48px}
.sec-head.center{text-align:center;margin-inline:auto}
.sec-head h2{font-size:clamp(30px,4.2cqi,46px);font-weight:700}
.sec-head p{color:var(--muted);font-size:18px;margin-top:14px}
.md{color:color-mix(in srgb,var(--text) 86%,var(--muted));font-size:17px}
.md p{margin:0 0 14px}
.md ul,.md ol{margin:0 0 14px;padding-left:22px}
.md li{margin:6px 0}
.md li::marker{color:var(--primary)}
.md strong{color:var(--text)}
.md a{color:var(--primary);text-decoration:underline;text-underline-offset:3px}
.md code{font-family:'JetBrains Mono',monospace;font-size:.88em;background:var(--soft);border:1px solid var(--border);padding:1px 6px;border-radius:6px}
.md blockquote{margin:0 0 14px;padding:4px 0 4px 16px;border-left:3px solid var(--primary);color:var(--muted)}
.md h3,.md h4,.md h5{font-family:var(--fh);margin:22px 0 10px}
.narrow{max-width:760px}

/* hero */
.sec-hero{padding:90px 0 70px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hero-copy h1{font-size:clamp(40px,6.2cqi,72px);font-weight:700;letter-spacing:-.035em}
.hero-copy .lead{font-size:19px;color:var(--muted);margin-top:22px;max-width:600px}
.avail{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--soft);font-size:13px;font-weight:500;margin-bottom:22px}
.avail .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 #22c55e88;animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px #22c55e00}100%{box-shadow:0 0 0 0 #22c55e00}}
.hero-meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:30px;color:var(--muted);font-size:14px}
.hero-meta span{display:inline-flex;gap:6px;align-items:center}
.socials{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.soc{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--border);background:var(--soft);color:var(--muted);transition:.2s}
.soc:hover{color:#fff;background:var(--primary);border-color:var(--primary);transform:translateY(-2px)}
.hero-vis{position:relative;padding:30px 10px}
.hero-photo{position:relative;aspect-ratio:4/5;max-width:400px;margin:auto}
.hero-photo img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:calc(var(--radius) * 1.6);z-index:1}
.hero-photo .ring{position:absolute;inset:-14px;border-radius:calc(var(--radius) * 1.6 + 14px);background:conic-gradient(from 0deg,var(--primary),var(--accent),var(--primary));opacity:.55;filter:blur(18px);animation:spin 14s linear infinite;will-change:transform}
.hero-mock{padding:20px;transform:rotate(-2deg);box-shadow:var(--shadow)}
.hero-shot{padding:12px;transform:rotate(-1.5deg);box-shadow:var(--shadow);cursor:pointer;transition:transform .3s}
.hero-shot:hover{transform:rotate(0) scale(1.01)}
.hero-shot .mock-top{margin:2px 4px 10px}
.hero-shot img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top left;border-radius:calc(var(--radius) * .6);border:1px solid var(--border);display:block}
.mock-kpis em.neg{color:#f43f5e;-webkit-text-fill-color:#f43f5e}
.mock-top{display:flex;gap:6px;align-items:center;margin-bottom:16px;font-size:13px}
.mock-top span{width:10px;height:10px;border-radius:50%;background:var(--border)}
.mock-top b{margin-left:8px;font-weight:600}
.mock-kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mock-kpis div{background:var(--soft);border:1px solid var(--border);border-radius:12px;padding:12px}
.mock-kpis small{display:block;color:var(--muted);font-size:12px}
.mock-kpis strong{font-family:var(--fh);font-size:22px}
.mock-kpis em{display:block;font-size:12px;font-style:normal;color:#22c55e;background:none;-webkit-text-fill-color:#22c55e}
.mock-chart{width:100%;margin:16px 0 8px}
.mock-bars{display:flex;align-items:flex-end;gap:8px;height:70px}
.mock-bars i{flex:1;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--accent),color-mix(in srgb,var(--accent) 30%,transparent))}
.float-chip{position:absolute;z-index:2;display:flex;flex-direction:column;padding:10px 16px;border-radius:14px;background:color-mix(in srgb,var(--surface) 94%,transparent);border:1px solid var(--border);box-shadow:var(--shadow);animation:float 6s ease-in-out infinite;will-change:transform}
.float-chip strong{font-family:var(--fh);font-size:20px;background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.float-chip span{font-size:12px;color:var(--muted)}
.float-chip.c0{top:0;left:-6px}.float-chip.c1{bottom:16%;right:-10px;animation-delay:-2s}.float-chip.c2{bottom:-4px;left:12%;animation-delay:-4s}
@keyframes float{50%{transform:translateY(-10px)}}

/* about */
.about-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:56px;align-items:start}
.facts{padding:8px 22px}
.fact{padding:16px 0;border-bottom:1px solid var(--border)}
.fact:last-child{border:0}
.fact small{display:block;color:var(--muted);font-size:13px}
.fact strong{font-weight:600}
.custom-img{border-radius:var(--radius);width:100%;object-fit:cover}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{padding:26px;text-align:center}
.stat-v{font-family:var(--fh);font-size:clamp(32px,4cqi,46px);font-weight:700;background:linear-gradient(100deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-l{color:var(--muted);font-size:14px}

/* projects */
.pfilter{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;margin-bottom:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-btn{padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--soft);color:var(--muted);font-size:14px;font-weight:500;transition:.2s}
.chip-btn:hover{color:var(--text)}
.chip-btn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.psearch{display:flex;align-items:center;gap:8px;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:var(--soft);color:var(--muted);min-width:260px}
.psearch input{border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:14px;padding:10px 0;width:100%}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.pcard{overflow:hidden;cursor:pointer;transition:transform .3s,border-color .3s,box-shadow .3s;display:flex;flex-direction:column}
.pcard:hover{transform:translateY(-6px);border-color:color-mix(in srgb,var(--primary) 50%,transparent);box-shadow:0 24px 60px -24px color-mix(in srgb,var(--primary) 60%,transparent)}
.pcard:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.pcard.is-hidden{opacity:.55}
.pcover{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--soft)}
.pcover img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.pcard:hover .pcover img{transform:scale(1.05)}
.pbadge{position:absolute;top:12px;left:12px;display:inline-flex;gap:5px;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:#000000b8;color:#fde68a}
.pbadge.off{left:auto;right:12px;color:#fff}
.pcat{position:absolute;bottom:12px;left:12px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--bg) 88%,transparent);color:var(--text)}
.pcat.static{position:static;display:inline-block;background:var(--pri-soft);color:var(--primary)}
.pbody{padding:22px;display:flex;flex-direction:column;gap:12px;flex:1}
.pbody h3{font-size:20px}
.pbody p{color:var(--muted);font-size:15px}
.pmetrics{display:flex;gap:18px;padding:12px 0;border-block:1px dashed var(--border)}
.pmetrics strong{display:block;font-family:var(--fh);font-size:18px;color:var(--text)}
.pmetrics small{color:var(--muted);font-size:12px}
.pmore{margin-top:auto;display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:600;font-size:14px}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius)}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.skill-g{padding:26px}
.skill-g h3{font-size:18px;margin-bottom:18px}
.skill{margin-bottom:16px}
.skill-t{display:flex;justify-content:space-between;font-size:15px;margin-bottom:7px}
.skill-t small{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent))}
.site.anim .bar i{width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1) .2s}
.site.anim .reveal.in .bar i{width:var(--w)}

/* timeline */
.tl{position:relative;padding-left:34px;max-width:900px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--primary),var(--accent),transparent)}
.tl-item{position:relative;margin-bottom:22px}
.tl-dot{position:absolute;left:-31px;top:26px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:3px solid var(--primary);box-shadow:0 0 0 5px var(--pri-soft)}
.tl-card{padding:22px 26px}
.tl-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:8px}
.tl-top h3{font-size:19px}
.tl-org{color:var(--primary);font-weight:500;font-size:15px}
.tl-period{flex:none;font-size:13px;padding:4px 12px;border-radius:99px;background:var(--soft);border:1px solid var(--border);color:var(--muted)}
.tl-card .md{font-size:15px}

/* certs & quotes */
.certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.cert{padding:22px;display:flex;gap:16px;align-items:flex-start}
.cert-i{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--pri-soft);color:var(--primary);font-size:24px;overflow:hidden}
.cert-i img{width:100%;height:100%;object-fit:cover}
.cert h3{font-size:16px;margin-bottom:4px}
.cert p{font-size:14px}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.quote{padding:28px;margin:0;position:relative}
.q-ic{font-size:30px;color:var(--primary);opacity:.4}
.quote blockquote{margin:14px 0 22px;font-size:17px}
.quote figcaption{display:flex;gap:12px;align-items:center}
.quote figcaption img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.quote figcaption small{display:block;color:var(--muted)}

/* project page: two columns with an "At a glance" side panel */
.pp-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:40px;align-items:start;padding-top:40px;padding-bottom:40px}
.pp-layout .pp-body{max-width:none;padding:0}
.pp-side{position:sticky;top:88px;display:flex;flex-direction:column;gap:14px}
.pp-glance{padding:18px 20px}
.pp-glance h4{font-family:var(--fh);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.pg-row{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-bottom:1px solid var(--border)}
.pg-row:last-child{border:0}
.pg-row small{color:var(--muted);font-size:12px}
.pg-row span{font-weight:600;font-size:14.5px}
.pg-row .tags{margin-top:3px}
.pg-file{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.pg-file:last-child{border:0}
.fic.sm{width:32px;height:34px;border-radius:8px}
.fic.sm .ic{width:16px;height:16px}
.pg-fn{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg-file .ib{width:32px;height:32px}
.pg-links{display:flex;flex-direction:column;gap:8px}
.pg-links .btn{width:100%}
.pp-overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:30px}
.pp-ov{padding:18px 20px}
.pp-ov-h{display:flex;align-items:center;gap:8px;color:var(--primary);margin-bottom:8px}
.pp-ov-h b{color:var(--text);font-family:var(--fh)}
.pp-ov .md{font-size:15px}
.pp-ov .md p:last-child,.pp-ov .md ul:last-child{margin-bottom:0}
.blk-empty{opacity:.55;outline:1px dashed #f59e0b;outline-offset:6px}
.blk-empty::after{content:"Empty heading: hidden on your live site";display:block;font:600 12px Inter,sans-serif;color:#f59e0b;margin-top:4px}

/* dashboard pages viewer */
.b-pages{overflow:hidden;padding:0}
.pg-tabs{display:flex;gap:4px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--border)}
.pg-tab{flex:none;border:0;padding:8px 14px;border-radius:9px;background:none;color:var(--muted);font:600 13.5px var(--fb);cursor:pointer}
.pg-tab:hover{color:var(--text);background:var(--soft)}
.pg-tab.on{background:var(--pri-soft);color:var(--primary)}
.pg-stage{position:relative;background:#00000022}
.pg-page{display:none;margin:0}
.pg-page.on{display:block;animation:tin .25s}
.pg-page img{width:100%;display:block;cursor:zoom-in}
.pg-page figcaption{padding:10px 16px;margin:0;text-align:left}
.pg-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--text);display:grid;place-items:center;cursor:pointer;opacity:.85}
.pg-nav:hover{opacity:1;border-color:var(--primary)}
.pg-nav.prev{left:12px}.pg-nav.next{right:12px}
.pg-count{text-align:center;font-size:12.5px;color:var(--muted);padding:8px}

/* file cards: full width, long notes fold */
.pp .b-files{grid-template-columns:1fr}
.fnote{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fmeta.open .fnote{display:block}
.fmore{border:0;background:none;padding:2px 0 0;color:var(--primary);font:600 12.5px var(--fb);cursor:pointer}
.fmeta small{white-space:normal}

/* LinkedIn-style entries (experience, education, certifications…) */
.entries{display:grid;gap:16px}
.entries.en-grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.entries.en-tl{position:relative;padding-left:30px;max-width:920px}
.entries.en-tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--primary),var(--accent),transparent)}
.entries.en-tl .entry::before{content:"";position:absolute;left:-29px;top:28px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--primary);box-shadow:0 0 0 4px var(--pri-soft)}
.entry{position:relative;display:flex;gap:16px;padding:20px 22px;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
.entry:hover{border-color:color-mix(in srgb,var(--primary) 50%,transparent);transform:translateY(-2px);box-shadow:var(--shadow)}
.entry:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.en-logo{width:52px;height:52px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--pri-soft);color:var(--primary);overflow:hidden}
.en-logo img{width:100%;height:100%;object-fit:contain;background:#fff;padding:3px}
.en-logo .ic{width:24px;height:24px}
.en-logo.lg{width:72px;height:72px;border-radius:16px}
.en-logo.lg img{cursor:zoom-in}
.en-b{flex:1;min-width:0}
.en-b h3{font-size:17px;margin-bottom:2px}
.en-sub{font-size:15px;color:var(--text);opacity:.92}
.en-m{font-size:13.5px;color:var(--muted)}
.en-desc{font-size:14.5px;margin-top:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.en-desc p,.en-desc ul{margin:0 0 4px}
.en-sk{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13.5px;color:var(--muted)}
.en-sk b{color:var(--text)}
.en-sk .ic{color:var(--primary);margin-top:3px}
.en-media{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mthumb{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;background:var(--soft);padding:0;overflow:hidden;cursor:pointer;color:var(--text);text-decoration:none;font:inherit;text-align:left}
.mthumb>img{width:72px;height:52px;object-fit:cover;display:block}
.mt-ic{width:52px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:color-mix(in srgb,var(--fc) 16%,transparent);color:var(--fc)}
.mt-ic b{font-size:9px;letter-spacing:.04em}
.mthumb:hover{border-color:var(--primary)}
.mt-more{align-self:center;font-size:13px;color:var(--muted)}
.en-more{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;font-weight:600;color:var(--primary)}

/* entry details window (outside the site, so it takes the site's colours from its style attribute) */
.edo{padding:3vh 3vw}
.ed{--border:color-mix(in srgb,var(--text) 11%,transparent);--soft:color-mix(in srgb,var(--text) 5%,transparent);--pri-soft:color-mix(in srgb,var(--primary) 16%,transparent);
  width:min(760px,96vw);max-height:92vh;overflow:auto;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);font-family:var(--fb);box-shadow:0 30px 90px #0009;line-height:1.6}
.ed h2,.ed h4{font-family:var(--fh);margin:0}
.ed-h{display:flex;gap:18px;padding:26px 60px 20px 28px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--pri-soft),transparent)}
.ed-ht{flex:1;min-width:0}
.ed-h h2{font-size:24px;line-height:1.2;margin:2px 0 4px}
.ed .eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--primary)}
.ed .btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;border:1px solid var(--border);background:var(--soft);color:var(--text);text-decoration:none}
.ed .btn:hover{border-color:var(--primary)}
.ed-cred{margin-top:12px}
.ed-b{padding:4px 28px 26px}
.ed-b section{padding:18px 0;border-bottom:1px solid var(--border)}
.ed-b section:last-child{border:0}
.ed-b h4{font-size:15px;margin-bottom:8px}
.ed .md{font-size:15px;color:var(--text)}
.ed .tags{display:flex;flex-wrap:wrap;gap:6px}
.ed .tag{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--soft);border:1px solid var(--border)}
.ed .muted{color:var(--muted);padding:18px 0}
.ed-media{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.mthumb.big{flex-direction:column;align-items:stretch;gap:0}
.mthumb.big>img,.mthumb.big .mt-ic{width:100%;height:120px}
.mt-t{padding:10px 12px}
.mt-t strong{display:block;font-size:14px}
.mt-t small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4;margin-top:2px}

/* images & attachments in sections */
.about-side{display:flex;flex-direction:column;gap:18px}
.about-img{width:100%;border-radius:var(--radius);border:1px solid var(--border);object-fit:cover;max-height:460px;cursor:zoom-in}
.sk-ic{width:20px;height:20px;object-fit:contain;border-radius:5px;display:inline-block;vertical-align:-4px;margin-right:8px}
.sk-gic{width:26px;height:26px;object-fit:contain;border-radius:7px;display:inline-block;vertical-align:-6px;margin-right:10px}
.tag .sk-ic{width:16px;height:16px;margin-right:6px;vertical-align:-3px}
.tl-logo{width:48px;height:48px;flex:none;border-radius:12px;object-fit:contain;background:#fff;padding:4px;border:1px solid var(--border)}
.tl-head{flex:1;min-width:0}
.tl-top{align-items:center}
.cert-b{flex:1;min-width:0}
.cert-i img{cursor:zoom-in}
.site .row.sm-row{margin-top:12px;gap:8px;align-items:center}
.site .row.sm-row .lnk{margin-top:0}

/* on-site file viewer (sits outside the site, so it carries its own colours) */
.fvo{padding:2vh 2vw}
.fv{--text:#e8ecf8;--muted:#9aa3bd;--primary:#8b6cff;--accent:#22d3ee;--soft:#ffffff0d;--border:#ffffff1a;--radius:12px;
  width:min(1100px,96vw);height:94vh;display:flex;flex-direction:column;background:#0f1424;color:var(--text);border:1px solid var(--border);border-radius:16px;overflow:hidden;font-family:Inter,system-ui,sans-serif;box-shadow:0 30px 90px #000a}
.fv-h{display:flex;align-items:center;gap:14px;padding:14px 64px 14px 18px;border-bottom:1px solid var(--border);background:#121a30}
.fv-h .fic{width:42px;height:46px}
.fv-t{flex:1;min-width:0}
.fv-t strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fv-t small{color:var(--muted);font-size:12px}
.fv-dl{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:0;border-radius:10px;background:linear-gradient(135deg,#7c5cff,#5b8cff);color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.fv-dl:disabled{opacity:.45;cursor:default}
.fv-b{flex:1;overflow:auto;background:#0b1020;position:relative}
.fv-b .boot-loader{min-height:100%}
.fv-img{max-width:100%;margin:auto;display:block;padding:16px}
.fv-video{width:100%;max-height:100%;background:#000;display:block}
.fv-pdf{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px}
.fv-pdf canvas{background:#fff;border-radius:4px;box-shadow:0 6px 24px #0008;max-width:100%}
.fv-tabs{position:sticky;top:0;display:flex;gap:4px;padding:8px;background:#121a30;border-bottom:1px solid var(--border);overflow-x:auto;z-index:1}
.fv-tab{border:0;padding:7px 14px;border-radius:8px;background:none;color:var(--muted);font:600 13px Inter,system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.fv-tab.on{background:#21a36633;color:#6ee7a8}
.fv-tbl{border-collapse:collapse;font-size:13px;margin:0}
.fv-tbl th,.fv-tbl td{border:1px solid #ffffff14;padding:6px 10px;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
.fv-tbl th{background:#182240;font-weight:600;position:sticky;top:0}
.fv-tbl th.rn{color:var(--muted);font-weight:400;background:#141c33;left:0;position:sticky}
.fv-tbl tr:hover td{background:#ffffff08}
.fv-code{border-radius:0;border:0;min-height:100%}
.fv-code pre[class*=language-]{max-height:none}
.fv-doc{max-width:900px;margin:0 auto;padding:24px}
.nb-cell{margin:16px 0}
.nb-out{margin:0;padding:10px 14px;background:#070b16;border:1px solid var(--border);border-top:0;font:13px/1.5 'JetBrains Mono',monospace;white-space:pre-wrap;color:#c8f7dc;max-height:420px;overflow:auto}
.nb-out.err{color:#fda4af}
.nb-img{display:block;max-width:100%;background:#fff;border:1px solid var(--border);border-top:0}
.fv-msg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px;color:var(--muted)}
.fv-msg>.ic{width:46px;height:46px;color:var(--primary)}
.fv-msg b{color:var(--text)}
.fv-msg .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:0;border-radius:10px;background:linear-gradient(135deg,#7c5cff,#5b8cff);color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer}
.fv-note{color:var(--muted);font-size:13px;text-align:center;padding:12px}

/* LinkedIn-style sections */
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.lcard{padding:22px}
.lcard-top{display:flex;gap:14px;align-items:flex-start}
.lcard-t{flex:1;min-width:0}
.lcard h3{font-size:16px;margin-bottom:4px}
.lcard-t p{font-size:14px}
.lcard .md{font-size:15px;margin-top:14px}
.lcard .md p:last-child{margin:0}
.langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.lang{display:flex;gap:14px;align-items:flex-start;padding:20px}
.lang>.ic{width:40px;height:40px;padding:10px;border-radius:12px;background:var(--pri-soft);color:var(--primary)}
.lang strong{display:block}
.lang small{color:var(--muted);font-size:13px}
.lvl{display:flex;gap:5px;margin-top:8px}
.lvl i{width:22px;height:6px;border-radius:4px;background:var(--soft);border:1px solid var(--border)}
.lvl i.on{background:linear-gradient(90deg,var(--primary),var(--accent));border-color:transparent}

/* contact */
.contact-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:56px;align-items:start}
.big{font-size:clamp(32px,4.6cqi,52px);font-weight:700}
.contact-grid .lead{color:var(--muted);font-size:18px;margin-top:16px}
.c-rows{display:flex;flex-direction:column;gap:12px;margin-top:30px}
.c-row{display:flex;gap:14px;align-items:center;font-weight:500}
.c-row>.ic{width:44px;height:44px;padding:12px;border-radius:12px;background:var(--pri-soft);color:var(--primary)}
.c-row small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.cform{padding:30px;display:flex;flex-direction:column;gap:16px}
.cform label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted);flex:1}
.cform input,.cform textarea{font:inherit;font-size:15px;color:var(--text);background:var(--soft);border:1px solid var(--border);border-radius:calc(var(--radius) * .5 + 4px);padding:12px 14px;outline:0;transition:.2s;resize:vertical;width:100%}
.cform input:focus,.cform textarea:focus{border-color:var(--primary);box-shadow:0 0 0 4px var(--pri-soft)}
.frow{display:flex;gap:16px}
.hp{position:absolute;left:-9999px;opacity:0;height:0}
.cform-err{color:#f87171;font-size:14px;min-height:1px}
.fine{font-size:12px;color:var(--muted);text-align:center}
.sent{text-align:center;padding:40px 10px}
.sent .ic{width:58px;height:58px;padding:14px;border-radius:50%;background:#22c55e22;color:#22c55e;margin-bottom:16px}
.sent h3{font-size:24px;margin-bottom:8px}
.sent p{color:var(--muted)}

/* footer */
.foot{border-top:1px solid var(--border);padding:44px 0 30px;position:relative;z-index:1}
.foot-in{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:center}
.foot p{margin-top:8px;font-size:14px}
.foot .socials{margin:0}
.foot-b{width:100%;display:flex;justify-content:space-between;color:var(--muted);font-size:13px;border-top:1px solid var(--border);padding-top:20px}
.foot-b a{display:inline-flex;gap:6px;align-items:center}
.foot-links{display:inline-flex;gap:20px;align-items:center}
.owner-login{opacity:.75;transition:opacity .2s,color .2s}
.owner-login:hover{opacity:1;color:var(--primary)}

/* project page */
.pp-hero{position:relative;padding:50px 0 40px;overflow:hidden}
.pp-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(60px) saturate(1.3);opacity:.28}
.pp-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,var(--bg))}
.pp-hero .wrap{z-index:1}
.pp-meta{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:14px;margin:30px 0 14px}
.pp-meta span{display:inline-flex;gap:6px;align-items:center}
.pp-hero h1{font-size:clamp(34px,5.4cqi,60px);font-weight:700;max-width:900px}
.pp-hero .lead{font-size:19px;color:var(--muted);margin:18px 0 22px;max-width:760px}
.pp-cover{width:100%;max-height:560px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border);cursor:zoom-in;box-shadow:var(--shadow)}
.pp-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:26px}
.pp-metrics .card{padding:20px}
.pp-metrics strong{display:block;font-family:var(--fh);font-size:30px;background:linear-gradient(100deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.pp-metrics small{color:var(--muted)}
.pp-body{max-width:920px;padding-top:40px;padding-bottom:40px}
.blk{margin-bottom:28px}
.blk-heading{margin:52px 0 16px}
.b-h2{font-size:clamp(24px,3cqi,32px)}
.b-h3{font-size:21px}
.pp-nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:90px}
.pp-nav a{padding:20px 24px;transition:.2s}
.pp-nav a:hover{border-color:var(--primary)}
.pp-nav a.r{text-align:right}
.pp-nav small{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:13px}
.pp-nav .r small{justify-content:flex-end}
.pp-nav strong{font-family:var(--fh);font-size:17px}

/* blocks */
.b-callout{display:flex;gap:16px;padding:20px 22px;border-radius:var(--radius);border:1px solid;--k:var(--primary);border-color:color-mix(in srgb,var(--k) 35%,transparent);background:color-mix(in srgb,var(--k) 9%,transparent)}
.b-callout .ci{width:38px;height:38px;flex:none;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--k) 20%,transparent);color:var(--k)}
.b-callout strong{display:block;margin-bottom:4px;color:var(--k)}
.b-callout .md{font-size:16px}.b-callout .md p:last-child{margin:0}
.k-success{--k:#10b981}.k-warning{--k:#f59e0b}.k-note{--k:#38bdf8}
.b-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{padding:20px}
.kpi small{color:var(--muted);font-size:13px}
.kpi strong{display:block;font-family:var(--fh);font-size:30px;margin:2px 0}
.kpi em{font-size:13px;font-style:normal;color:#22c55e;-webkit-text-fill-color:#22c55e;background:none}
.kpi em.neg{color:#f43f5e;-webkit-text-fill-color:#f43f5e}
.b-embed{margin:0;overflow:hidden}
.b-embed-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.b-embed-bar>.ic{color:var(--primary)}
.b-embed-bar a{margin-left:auto;display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-weight:500;font-size:13px}
.b-frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.b-img,.b-video,.b-table{margin:0}
.b-img img{width:100%;border-radius:var(--radius);border:1px solid var(--border);cursor:zoom-in}
.b-img.wide{margin-inline:calc(min(0px, (920px - 100cqi) / 2))}
.site figcaption{color:var(--muted);font-size:14px;margin-top:10px;text-align:center}
.b-gal{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:12px}
.b-gal figure{margin:0}
.b-gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:calc(var(--radius) * .7);cursor:zoom-in;transition:.3s}
.b-gal img:hover{transform:scale(1.02)}
.ratio{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:#000}
.ratio iframe{position:absolute;inset:0;width:100%;height:100%}
.b-video video{width:100%;border-radius:var(--radius);background:#000}
.b-files{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.fcard{display:flex;align-items:center;gap:14px;padding:14px 16px}
.fic{width:48px;height:52px;flex:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:color-mix(in srgb,var(--fc) 18%,transparent);color:var(--fc)}
.fic b{font-size:9px;letter-spacing:.05em}
.fmeta{flex:1;min-width:0}
.fmeta strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta small{color:var(--muted);font-size:12px}
.fact-btns{display:flex;gap:6px}
.site .ib{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--border);background:var(--soft);color:var(--text);transition:.2s}
.site .ib:hover{background:var(--primary);border-color:var(--primary);color:#fff}
.ph-mini{font-size:11px;color:var(--muted);border:1px dashed var(--border);padding:4px 8px;border-radius:8px}
.b-code{border-radius:var(--radius);overflow:hidden;border:1px solid #ffffff14;background:#1d1f27}
.b-code-bar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#15161d;color:#9aa0b4;font:500 13px 'JetBrains Mono',monospace}
.b-code-bar button{margin-left:auto;display:inline-flex;gap:6px;align-items:center;background:#ffffff10;color:#d1d5db;border:0;border-radius:8px;padding:5px 10px;font-size:12px}
.b-code-bar button:hover{background:#ffffff22}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.b-code pre[class*=language-]{margin:0;border-radius:0;background:#1d1f27;font:14px/1.6 'JetBrains Mono',monospace;padding:18px 20px;max-height:560px}
.b-code code[class*=language-]{font-family:'JetBrains Mono',monospace;font-size:14px;text-shadow:none}
.b-out{border-top:1px solid #ffffff14;background:#111218;padding:12px 20px}
.b-out small{color:#6b7280;font:600 11px 'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.08em}
.b-out pre{margin:6px 0 0;color:#a7f3d0;font:13px/1.6 'JetBrains Mono',monospace;white-space:pre-wrap}
.b-chart{padding:20px 22px;margin:0}
.b-chart .t{text-align:left;color:var(--text);font-weight:600;font-size:15px;margin:0 0 10px}
.chart{width:100%;height:auto;display:block}
.chart .ch-grid{stroke:var(--border)}

/* ---------- responsive (container queries) ---------- */
@container site (max-width: 960px){
  .pp-layout{grid-template-columns:1fr;gap:24px}
  .pp-side{position:static;order:-1}
  .hero-grid,.about-grid,.contact-grid{grid-template-columns:1fr;gap:40px}
  .hero-vis{max-width:480px;width:100%;margin:auto}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@container site (max-width: 760px){
  .nav-links,.nav-cta .btn{display:none}
  .burger{display:grid}
  .nav-cta{margin-left:auto}
  .site.menu-open .nav-mobile{display:flex;flex-direction:column;padding:8px 16px 16px;border-top:1px solid var(--border)}
  .nav-mobile a{padding:12px 6px;border-bottom:1px solid var(--border);font-weight:500}
  .site .wrap{padding:0 16px}
  .sec{padding:72px 0}
  .sec-hero{padding:50px 0}
  .pgrid,.certs,.quotes,.b-files,.lcards,.langs,.entries.en-grid{grid-template-columns:1fr}

/* ---------- smoothness: honour "reduce motion" and pause off-screen effects ---------- */
@media (prefers-reduced-motion: reduce){
  .site *,.site *::before,.site *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .site.anim .reveal{opacity:1;transform:none}
}
.site .pcard,.site .pcover img{backface-visibility:hidden}
.sec-hero.paused *,.sec-hero.paused *::before{animation-play-state:paused!important}

    table: { label: 'Table from data', icon: 'table', make: () => ({ caption: '', csv: 'Column A,Column B\nValue,123' }) },
    links: { label: 'Buttons / links', icon: 'link', make: () => ({ items: [{ label: 'View on GitHub', url: '' }] }) },
    divider: { label: 'Divider', icon: 'minus', make: () => ({}) }
  };
  const newBlock = type => Object.assign({ id: uid('b'), type }, BLOCK_TYPES[type].make());

  /* ---------------- generated covers ---------------- */
  function coverSvg(seedText, t) {
    const r = rng(hash(seedText));
    const W = 800, H = 500;
    let bars = '', pts = [];
    const n = 12;
    for (let i = 0; i < n; i++) {
      const h = 60 + r() * 220, x = 60 + i * 58;
      bars += `<rect x="${x}" y="${H - 50 - h}" width="34" height="${h}" rx="6" fill="#fff" opacity="${0.08 + r() * 0.1}"/>`;
      pts.push([x + 17, H - 120 - r() * 220]);
    }
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(0) + ' ' + p[1].toFixed(0)).join(' ');
    const svg = `<svg xmlns="http:\/\/www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${t.primary}"/><stop offset="1" stop-color="${t.accent}"/></linearGradient><radialGradient id="r" cx="${20 + r() * 60}%" cy="20%" r="80%"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect width="${W}" height="${H}" fill="url(#g)"/><rect width="${W}" height="${H}" fill="url(#r)"/><g stroke="#fff" stroke-opacity=".08">${[1, 2, 3, 4, 5].map(i => `<path d="M0 ${i * 85}H${W}"/>`).join('')}</g>${bars}<path d="${line}" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="7" fill="#fff"/>`).join('')}</svg>`;
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  /* ---------------- data: CSV, chart, table ---------------- */
  function parseCSV(text) {
    const rows = [];
    for (const line of String(text || '').replace(/\r/g, '').split('\n')) {
      if (!line.trim()) continue;
      const out = []; let cur = '', q = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
        else if (c === '"') q = true;
        else if (c === ',' || c === '\t') { out.push(cur.trim()); cur = ''; }
        else cur += c;
      }
      out.push(cur.trim());
      rows.push(out);
    }
    return rows;
  }
  const num = x => { const v = parseFloat(String(x).replace(/[^0-9.\-]/g, '')); return isNaN(v) ? 0 : v; };
  const fmtTick = v => Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : Math.abs(v) >= 1e3 ? (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(+v.toFixed(2));
  function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
  const SERIES = ['var(--primary)', 'var(--accent)', '#f59e0b', '#10b981', '#f43f5e', '#a78bfa'];

  function chartSvg(csv, type) {
    const rows = parseCSV(csv).filter(r => r.length > 1);
    if (rows.length < 2) return '';
    const series = rows[0].slice(1);
    const data = rows.slice(1).map(r => ({ l: r[0], v: series.map((_, i) => num(r[i + 1])) }));
    const W = 720, H = 320, pl = 52, pr = 18, pt = 18, pb = 44, iw = W - pl - pr, ih = H - pt - pb;
    const max = niceMax(Math.max(0, ...data.flatMap(d => d.v)));
    const y = v => pt + ih - (Math.max(v, 0) / max) * ih;
    let g = '';
    for (let i = 0; i <= 4; i++) {
      const v = max * i / 4, yy = y(v);
      g += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" class="ch-grid"/><text x="${pl - 10}" y="${yy + 4}" text-anchor="end" class="ch-t">${fmtTick(v)}</text>`;
    }
    const every = Math.ceil(data.length / 12);
    let marks = '';
    if (type === 'line') {
      const step = iw / Math.max(data.length - 1, 1), x = i => pl + i * step;
      series.forEach((s, si) => {
        const d = data.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v[si]).toFixed(1)).join(' ');
        if (si === 0) marks += `<path d="${d} L${x(data.length - 1)} ${pt + ih} L${pl} ${pt + ih}Z" fill="${SERIES[0]}" opacity=".12"/>`;
        marks += `<path d="${d}" fill="none" stroke="${SERIES[si % 6]}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
        marks += data.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v[si])}" r="4" fill="${SERIES[si % 6]}"><title>${esc(p.l)} · ${esc(s)}: ${p.v[si]}</title></circle>`).join('');
      });
      marks += data.map((p, i) => i % every ? '' : `<text x="${x(i)}" y="${H - 16}" text-anchor="middle" class="ch-t">${esc(String(p.l).slice(0, 14))}</text>`).join('');
    } else {
      const band = iw / data.length, gw = band * 0.72, bw = gw / series.length;
      data.forEach((p, i) => {
        const x0 = pl + i * band + (band - gw) / 2;
        p.v.forEach((v, si) => {
          const yy = y(v), h = pt + ih - yy;
          marks += `<rect x="${(x0 + si * bw + 1).toFixed(1)}" y="${yy.toFixed(1)}" width="${Math.max(bw - 2, 2).toFixed(1)}" height="${Math.max(h, 0).toFixed(1)}" rx="${Math.min(6, bw / 4).toFixed(1)}" fill="${SERIES[si % 6]}"><title>${esc(p.l)} · ${esc(series[si])}: ${v}</title></rect>`;
        });
        if (!(i % every)) marks += `<text x="${(pl + i * band + band / 2).toFixed(1)}" y="${H - 16}" text-anchor="middle" class="ch-t">${esc(String(p.l).slice(0, 14))}</text>`;
      });
    }
    const legend = series.length > 1 ? `<div class="ch-legend">${series.map((s, i) => `<span><i style="background:${SERIES[i % 6]}"></i>${esc(s)}</span>`).join('')}</div>` : '';
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">${g}${marks}</svg>${legend}`;
  }

  function tableHtml(csv) {
    const rows = parseCSV(csv);
    if (!rows.length) return '';
    const isNum = v => /^[-+₹$€£]?\s?[\d,.]+\s?%?[kKmMbB]?$/.test(v);
    return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${rows[0].map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td class="${isNum(c) ? 'n' : ''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  }

  /* ---------------- renderer ---------------- */
  const SOCIALS = [['linkedin', 'LinkedIn'], ['github', 'GitHub'], ['kaggle', 'Kaggle'], ['tableau', 'Tableau Public'], ['medium', 'Medium'], ['youtube', 'YouTube'], ['twitter', 'X / Twitter'], ['website', 'Website']];
  function socials(p, cls = '') {
    const s = p.socials || {};
    const items = SOCIALS.filter(([k]) => safeUrl(s[k])).map(([k, l]) => `<a class="soc" href="${esc(safeUrl(s[k]))}" target="_blank" rel="noopener" title="${l}" aria-label="${l}">${ic(k)}</a>`);
    if (p.email) items.push(`<a class="soc" href="mailto:${esc(p.email)}" title="Email" aria-label="Email">${ic('mail')}</a>`);
    return items.length ? `<div class="socials ${cls}">${items.join('')}</div>` : '';
  }
  const initials = n => String(n || '?').split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const firstOf = (d, type) => (d.sections.find(s => s.type === type && s.visible !== false) || {}).id;
  const visibleProjects = (d, ctx) => d.projects.filter(p => ctx.admin || p.visible !== false);
  const cover = p => p.cover ? img(p.cover) : coverSvg(p.id + p.title, CUR);

  function renderSite(d, ctx = {}) {
    const t = d.settings.theme, mode = resolveMode(t, ctx.mode);
    CUR = palettes(t)[mode];
    ensureFonts([t.fontHeading || 'Inter', t.fontBody || 'Inter', ctx.view ? 'JetBrains Mono' : '']);
    const secs = d.sections.filter(s => s.visible !== false);
    const proj = ctx.view && d.projects.find(p => p.id === ctx.view);
    const body = proj ? renderProjectPage(d, proj, ctx) : secs.map(s => renderSection(d, s, ctx)).join('');
    const cls = ['site', mode, 'cs-' + (t.cardStyle || 'glass'), ctx.admin ? 'is-admin' : '', t.animations !== false && !ctx.admin ? 'anim' : ''].join(' ');
    return `<div class="${cls}" style="${themeVars(t, mode)}">
      ${t.background && t.background !== 'none' ? `<div class="bgfx bg-${esc(t.background)}"></div>` : ''}
      ${renderNav(d, secs, ctx, mode)}
      <main>${body}</main>
      ${renderFooter(d)}
    </div>`;
  }

  function renderNav(d, secs, ctx, mode) {
    const p = d.profile;
    const links = secs.filter(s => s.navShow !== false && s.type !== 'hero' && s.type !== 'contact')
      .map(s => `<a data-go="${esc(s.id)}">${esc(s.title || SECTION_TYPES[s.type].label)}</a>`).join('');
    const contact = firstOf(d, 'contact');
    return `<header class="nav"><div class="wrap nav-in">
      <a class="brand" data-go="top"><span class="logo">${initials(p.name)}</span><span>${esc(p.name)}</span></a>
      <nav class="nav-links">${links}</nav>
      <div class="nav-cta">${d.settings.theme.toggle !== false ? `<button class="mode-btn" data-mode title="Switch to ${mode === 'dark' ? 'light' : 'dark'} mode" aria-label="Switch to ${mode === 'dark' ? 'light' : 'dark'} mode">${modeBtn(mode)}</button>` : ''}${contact ? `<a class="btn btn-primary sm" data-go="${esc(contact)}">Hire me</a>` : ''}
      <button class="burger" data-burger aria-label="Menu">${ic('menu')}</button></div>
    </div><div class="nav-mobile">${links}${contact ? `<a data-go="${esc(contact)}">Contact</a>` : ''}</div></header>`;
  }

  /** Studio address: the deployed web app with ?page=admin (or ?admin in the local preview). */
  const adminUrl = () => BOOT.appUrl && !API ? BOOT.appUrl + '?page=admin' : '?admin';
  /** Address of the public site: this page on GitHub, the web app on Apps Script. */
  const siteUrl = () => API ? location.pathname : BOOT.appUrl || '';

  function renderFooter(d) {
    const p = d.profile;
    return `<footer class="foot"><div class="wrap foot-in">
      <div><div class="brand"><span class="logo">${initials(p.name)}</span><span>${esc(p.name)}</span></div>
      <p class="muted">${esc(d.settings.footerText || '')}</p></div>
      ${socials(p)}
      <div class="foot-b"><span>© ${new Date().getFullYear()} ${esc(p.name)}</span>
        <span class="foot-links">${d.settings.showLogin !== false ? `<a class="owner-login" href="${esc(adminUrl())}" target="_top" title="Edit this portfolio">${ic('lock')} Owner login</a>` : ''}
        <a data-go="top">Back to top ${ic('arrow-up')}</a></span></div>
    </div></footer>`;
  }

  const head = (s, center) => (s.title || s.subtitle || s.eyebrow) ? `<div class="sec-head reveal ${center ? 'center' : ''}">
      ${s.eyebrow ? `<div class="eyebrow">${esc(s.eyebrow)}</div>` : ''}
      <h2>${inline(s.title || '')}</h2>${s.subtitle ? `<p>${inline(s.subtitle)}</p>` : ''}</div>` : '';
  const wrapSec = (s, inner, cls = '') => `<section class="sec sec-${s.type} ${cls}" id="s-${esc(s.id)}" data-sec="${esc(s.id)}" data-label="${esc((SECTION_TYPES[s.type] || {}).label || s.type)}"><div class="wrap">${inner}</div></section>`;

  /* ---------------- LinkedIn-style entries: experience, education, certifications, courses… ---------------- */
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const joinParts = (arr, sep = ' · ') => arr.filter(Boolean).join(sep);
  const my = (m, y) => y ? ((+m ? MONTHS[+m - 1].slice(0, 3) + ' ' : '') + y) : '';
  const dated = (i, k) => i[k + 'Year'] ? my(i[k + 'Month'], i[k + 'Year']) : '';
  function span(i, withCurrent) {
    const s = dated(i, 'start'), e = withCurrent && i.current ? 'Present' : dated(i, 'end');
    return s && e ? s + ' – ' + e : s || e;
  }
  /** LinkedIn-style length of a role, e.g. "2 yrs 3 mos". */
  function duration(i) {
    if (!i.startYear) return '';
    const s = (+i.startYear) * 12 + ((+i.startMonth || 1) - 1), now = new Date();
    const e = i.current ? now.getFullYear() * 12 + now.getMonth() : i.endYear ? (+i.endYear) * 12 + ((+i.endMonth || 12) - 1) : null;
    if (e == null || e < s) return '';
    const n = e - s + 1, y = Math.floor(n / 12), m = n % 12;
    return joinParts([y ? y + (y > 1 ? ' yrs' : ' yr') : '', m ? m + (m > 1 ? ' mos' : ' mo') : ''], ' ');
  }
  const ENTRY = {
    experience: { label: 'experience', icon: 'briefcase', view: i => ({
      title: i.title, sub: joinParts([i.org, i.empType]), logo: i.logo,
      line1: joinParts([i.startYear ? span(i, true) : i.period, duration(i)]), line2: joinParts([i.location, i.locType]) }) },
    education: { label: 'education', icon: 'book', view: i => ({
      title: i.org || i.title, sub: joinParts([i.degree, i.field], ', ') || (i.org && i.title !== i.org ? i.title : ''), logo: i.logo,
      line1: i.startYear ? span(i) : i.period, line2: i.grade ? 'Grade: ' + i.grade : '',
      extra: [['Activities and societies', i.activities]] }) },
    volunteering: { label: 'volunteer experience', icon: 'heart', view: i => ({
      title: i.title, sub: i.org, logo: i.logo,
      line1: joinParts([i.startYear ? span(i, true) : i.period, duration(i)]), line2: i.cause || i.location }) },
    certification: { label: 'license or certification', icon: 'award', view: i => ({
      title: i.name, sub: i.issuer, logo: i.image, credUrl: i.url,
      line1: joinParts([i.issueYear ? 'Issued ' + dated(i, 'issue') : i.date, i.expYear ? 'Expires ' + dated(i, 'exp') : '']),
      line2: i.credentialId ? 'Credential ID ' + i.credentialId : '' }) },
    course: { label: 'course', icon: 'book', view: i => ({ title: i.title, sub: joinParts([i.number, i.subtitle]), logo: i.image, line1: i.date }) },
    honor: { label: 'honor or award', icon: 'award', view: i => ({
      title: i.title, sub: i.subtitle ? 'Issued by ' + i.subtitle : '', logo: i.image,
      line1: joinParts([i.issueYear ? dated(i, 'issue') : i.date, i.assoc ? 'Associated with ' + i.assoc : '']) }) },
    publication: { label: 'publication', icon: 'book', view: i => ({
      title: i.title, sub: joinParts([i.subtitle, i.issueYear ? dated(i, 'issue') : i.date]), logo: i.image,
      line2: i.authors ? 'Authors: ' + i.authors : '', credUrl: i.url, credLabel: 'Show publication' }) },
    testscore: { label: 'test score', icon: 'kpi', view: i => ({
      title: i.title, sub: i.subtitle ? 'Score: ' + i.subtitle : '', logo: i.image,
      line1: joinParts([i.issueYear ? dated(i, 'issue') : i.date, i.assoc ? 'Associated with ' + i.assoc : '']) }) },
    patent: { label: 'patent', icon: 'bulb', view: i => ({
      title: i.title, sub: joinParts([i.subtitle, i.number]), logo: i.image,
      line1: joinParts([i.status, i.issueYear ? dated(i, 'issue') : i.date]), line2: i.authors ? 'Inventors: ' + i.authors : '',
      credUrl: i.url, credLabel: 'Show patent' }) },
    organization: { label: 'organization', icon: 'users', view: i => ({
      title: i.title, sub: i.subtitle, logo: i.image,
      line1: joinParts([i.startYear ? span(i, true) : i.date, i.assoc ? 'Associated with ' + i.assoc : '']) }) }
  };
  const SECTION_ENTRY = { certifications: 'certification', courses: 'course', honors: 'honor', publications: 'publication', testscores: 'testscore', patents: 'patent', organizations: 'organization', volunteering: 'volunteering' };
  /** Which entry form a section uses ('' for sections that are not lists of entries). */
  const entryType = s => SECTION_ENTRY[s.type] || (s.type === 'timeline' ? (s.kind || (s.id === 'education' ? 'education' : 'experience')) : '');

  function entryModel(s, i) {
    const t = ENTRY[entryType(s)], v = t.view(i);
    v.icon = t.icon;
    v.body = i.body || '';
    v.skills = (i.skills || []).filter(Boolean);
    v.media = (i.media || []).filter(m => hasFile(m.url));
    if (hasFile(i.file) && !v.media.some(m => m.url === i.file)) v.media.unshift({ url: i.file, name: i.fileName || '', title: i.fileLabel || i.fileName || 'Document' });
    v.extra = (v.extra || []).filter(e => e[1]);
    return v;
  }

  function mediaKind(m) {
    const n = m.name || m.url;
    if (viewKind(n) === 'image' || /^data:image/.test(m.url)) return 'image';
    if (m.name || driveId(m.url) || /^data:/.test(m.url)) return 'file';
    return 'link';
  }
  function mediaThumb(m, big) {
    const k = mediaKind(m), fm = fileMeta(m.name || m.url);
    const pic = k === 'image' ? `<img src="${esc(img(m.url))}" alt="" loading="lazy">`
      : `<span class="mt-ic" style="--fc:${k === 'link' ? 'var(--primary)' : fm.color}">${ic(k === 'link' ? 'link' : fm.icon)}<b>${esc(k === 'link' ? 'LINK' : fm.ext.slice(0, 5))}</b></span>`;
    const label = big ? `<span class="mt-t"><strong>${esc(m.title || m.name || 'Media')}</strong>${m.desc ? `<small>${esc(m.desc)}</small>` : ''}</span>` : '';
    if (k === 'link') return `<a class="mthumb ${big ? 'big' : ''}" href="${esc(safeUrl(m.url))}" target="_blank" rel="noopener" title="${esc(m.title || m.url)}">${pic}${label}</a>`;
    const act = k === 'image' ? `data-lightbox="${esc(img(m.url))}"` : `data-fview data-url="${esc(m.url)}" data-name="${esc(m.name || '')}"`;
    return `<button class="mthumb ${big ? 'big' : ''}" ${act} title="${esc(m.title || m.name || '')}">${pic}${label}</button>`;
  }

  function entryCard(s, i, idx) {
    const v = entryModel(s, i);
    return `<article class="card entry reveal" data-entry="${esc(s.id)}:${idx}" tabindex="0" role="button" aria-label="${esc(v.title || '')}: see details">
      <div class="en-logo">${v.logo ? `<img src="${esc(img(v.logo))}" alt="">` : ic(v.icon)}</div>
      <div class="en-b"><h3>${esc(v.title || 'Untitled')}</h3>${v.sub ? `<div class="en-sub">${esc(v.sub)}</div>` : ''}
        ${v.line1 ? `<div class="en-m">${esc(v.line1)}</div>` : ''}${v.line2 ? `<div class="en-m">${esc(v.line2)}</div>` : ''}
        ${v.body ? `<div class="md en-desc">${md(v.body)}</div>` : ''}
        ${v.skills.length ? `<div class="en-sk">${ic('zap')}<span><b>Skills:</b> ${v.skills.map(esc).join(' · ')}</span></div>` : ''}
        ${v.media.length ? `<div class="en-media">${v.media.slice(0, 4).map(m => mediaThumb(m)).join('')}${v.media.length > 4 ? `<span class="mt-more">+${v.media.length - 4}</span>` : ''}</div>` : ''}
        <span class="en-more">See details ${ic('arrow-right')}</span></div></article>`;
  }
  function entriesSection(d, s) {
    const list = s.type === 'timeline' || s.type === 'volunteering' ? 'en-tl' : 'en-grid';
    return wrapSec(s, `${head(s)}<div class="entries ${list}">${(s.items || []).map((i, k) => entryCard(s, i, k)).join('')}</div>`);
  }

  /** Details window for one entry, like opening an item on LinkedIn. */
  function openEntry(root, d, ref) {
    const [sid, idx] = String(ref).split(':');
    const s = d.sections.find(x => x.id === sid), i = s && (s.items || [])[+idx];
    if (!i) return;
    const v = entryModel(s, i), site = $('.site', root);
    const cred = safeUrl(v.credUrl);
    const box = overlay(`<div class="ed ${site.classList.contains('light') ? 'light' : 'dark'}" style="${esc(site.getAttribute('style'))}" role="dialog" aria-label="${esc(v.title || '')}">
      <div class="ed-h"><div class="en-logo lg">${v.logo ? `<img src="${esc(img(v.logo))}" alt="" data-lightbox="${esc(img(v.logo))}">` : ic(v.icon)}</div>
        <div class="ed-ht"><div class="eyebrow">${esc(s.title || '')}</div><h2>${esc(v.title || 'Untitled')}</h2>
          ${v.sub ? `<div class="en-sub">${esc(v.sub)}</div>` : ''}${v.line1 ? `<div class="en-m">${esc(v.line1)}</div>` : ''}${v.line2 ? `<div class="en-m">${esc(v.line2)}</div>` : ''}
          ${cred ? `<a class="btn btn-ghost sm ed-cred" href="${esc(cred)}" target="_blank" rel="noopener">${esc(v.credLabel || 'Show credential')} ${ic('external')}</a>` : ''}</div></div>
      <div class="ed-b">
        ${v.body ? `<section><h4>Description</h4><div class="md">${md(v.body)}</div></section>` : ''}
        ${v.extra.map(([k, val]) => `<section><h4>${esc(k)}</h4><div class="md">${md(val)}</div></section>`).join('')}
        ${v.skills.length ? `<section><h4>Skills</h4><div class="tags">${v.skills.map(x => `<span class="tag lg">${esc(x)}</span>`).join('')}</div></section>` : ''}
        ${v.media.length ? `<section><h4>Media</h4><div class="ed-media">${v.media.map(m => mediaThumb(m, true)).join('')}</div></section>` : ''}
        ${!v.body && !v.extra.length && !v.skills.length && !v.media.length ? '<p class="muted">No further details have been added yet.</p>' : ''}
      </div></div>`, 'edo');
    box.addEventListener('click', e => { if (fileClick(e.target)) e.stopPropagation(); });
  }

  /** Lightbox / view / download clicks, shared by the site and the details window. */
  function fileClick(t) {
    const lb = t.closest('[data-lightbox]');
    if (lb) { overlay(`<img class="lb-img" src="${esc(lb.dataset.lightbox)}" alt="">`, 'lb'); return true; }
    const fv = t.closest('[data-fview]');
    if (fv) { viewFile(fv.dataset.url, fv.dataset.name); return true; }
    const fd = t.closest('[data-fdl]');
    if (fd) { downloadFile(fd.dataset.url, fd.dataset.name); return true; }
    return false;
  }

  /** Brings entries saved by older versions (free-text dates, single file) into the LinkedIn fields. */
  function parseMY(str) {
    const m = String(str || '').match(/([A-Za-z]{3,})?\.?\s*(\d{4})/);
    if (!m) return null;
    const mi = m[1] ? MONTHS.findIndex(x => x.slice(0, 3).toLowerCase() === m[1].slice(0, 3).toLowerCase()) + 1 : 0;
    return { m: mi > 0 ? String(mi) : '', y: m[2] };
  }
  function migrateEntries(d) {
    (d.sections || []).forEach(s => {
      const type = entryType(s);
      if (!type) return;
      (s.items || []).forEach(i => {
        if (i.file && !(i.media || []).some(m => m.url === i.file)) i.media = [{ url: i.file, name: i.fileName || '', title: i.fileLabel || i.fileName || 'Document', desc: '' }].concat(i.media || []);
        delete i.file; delete i.fileName; delete i.fileLabel;
        if (['experience', 'volunteering', 'education'].includes(type) && i.period && !i.startYear) {
          const parts = String(i.period).split(/\s*[—–-]\s*|\s+to\s+/i), a = parseMY(parts[0]), b = parseMY(parts[1]);
          if (a) {
            i.startMonth = a.m; i.startYear = a.y;
            if (b) { i.endMonth = b.m; i.endYear = b.y; } else if (/present|now|current/i.test(parts[1] || '')) i.current = true;
            delete i.period;
          }
        }
        if (type === 'education') {
          if (!i.org && i.title) { i.org = i.title; delete i.title; } else if (i.title && !i.degree) { i.degree = i.title; delete i.title; }
          if (i.period && !i.grade) { i.grade = String(i.period).replace(/^grade[\s:]{0,3}/i, ''); delete i.period; }
        }
        if (type === 'certification') {
          if (i.date && !i.issueYear) {
            const a = parseMY(i.date), ex = String(i.date).match(/(?:valid|expires?)\D*?([A-Za-z]{3,}\s*\d{4}|\d{4})/i);
            if (a) { i.issueMonth = a.m; i.issueYear = a.y; delete i.date; }
            if (ex) { const b = parseMY(ex[1]); i.expMonth = b.m; i.expYear = b.y; }
          }
          const id = String(i.issuer || '').match(/^(.*?)\s*·\s*ID\s*(\S+)$/);
          if (id && !i.credentialId) { i.issuer = id[1]; i.credentialId = id[2]; }
        }
      });
    });
    return d;
  }

  /**
   * The best real dashboard picture from your projects (featured first):
   * the cover, then a Dashboard pages screenshot, then a gallery or image block.
   */
  function projectShot(d, ctx) {
    const ps = visibleProjects(d, ctx || {}).slice().sort((a, b) => (b.featured ? 1 : 0) - (a.featured ? 1 : 0));
    for (const p of ps) {
      const imgs = [p.cover];
      (p.blocks || []).forEach(b => {
        if (b.type === 'pages' || b.type === 'gallery') (b.items || []).forEach(x => imgs.push(x.url));
        if (b.type === 'image') imgs.push(b.url);
      });
      const u = imgs.find(x => img(x));
      if (u) return { src: img(u), id: p.id, title: String(p.title || '').trim() };
    }
    return null;
  }

  function renderSection(d, s, ctx) {
    const R = RENDER_SECTION[s.type];
    // One faulty section must never blank the whole site
    try { return R ? R(d, s, ctx) : ''; }
    catch (err) {
      console.error('Section "' + s.id + '" could not be shown', err);
      return ctx.admin ? `<section class="sec" data-sec="${esc(s.id)}"><div class="wrap"><div class="ph">${ic('alert')}<span>This section could not be shown (${esc(err.message)}). It is hidden on your live site.</span></div></div></section>` : '';

    },
    stats(d, s, ctx) {
      return wrapSec(s, `${s.title && s.showTitle ? head(s, true) : ''}<div class="stats">${(s.items || []).map(it => {
        const n = num(it.value), dec = (String(it.value).split('.')[1] || '').length;

    projects(d, s, ctx) {

        <blockquote>${inline(q.quote)}</blockquote><figcaption>${q.photo ? `<img src="${esc(img(q.photo))}" alt="">` : `<span class="logo sm">${initials(q.name)}</span>`}<span><strong>${esc(q.name)}</strong><small>${esc(q.role || '')}</small></span></figcaption></figure>`).join('')}</div>`);

          <div class="pbody"><h3>${esc(f.title || (proj && proj.title) || '')}</h3>${f.text || proj ? `<p>${esc(f.text || proj.summary || '')}</p>` : ''}

  // LinkedIn-style sections reuse a few shared layouts

  function projectCards(d, ps, f = {}) {

  function renderProjectPage(d, p, ctx) {

    const L = p.links || {};

      safeUrl(L.live) && `<a class="btn btn-primary" href="${esc(safeUrl(L.live))}" target="_blank" rel="noopener">${ic('external')} Live dashboard</a>`,
      safeUrl(L.repo) && `<a class="btn btn-ghost" href="${esc(safeUrl(L.repo))}" target="_blank" rel="noopener">${ic('github')} Source code</a>`,
      safeUrl(L.extra) && `<a class="btn btn-ghost" href="${esc(safeUrl(L.extra))}" target="_blank" rel="noopener">${ic('link')} ${esc(L.extraLabel || 'More')}</a>`
    ].filter(Boolean).join('');
    const D = p.details || {};
    const files = (p.blocks || []).filter(b => b.type === 'file').flatMap(b => (b.items || []).filter(f => hasFile(f.url)));

    // Render every block, then drop headings with nothing under them (public site only)
    const parts = (p.blocks || []).map(b => ({ b, html: renderBlock(b, ctx) })).filter(x => x.html);
    const shown = parts.filter((x, k) => {
      if (x.b.type !== 'heading' || ctx.admin) return true;

    }).join('');

    const overview = [['Objective', D.objective, 'bulb'], ['Approach', D.approach, 'layers'], ['Impact', D.impact, 'kpi']].filter(x => String(x[1] || '').trim());
    const glance = [['Category', p.category], ['Year', p.date], ['My role', D.role], ['Duration', D.duration], ['Dataset', D.dataset]].filter(x => String(x[1] || '').trim());

    return `<article class="pp" data-sec="__project" data-label="Project">
      <div class="pp-hero"><div class="pp-bg" style="background-image:url('${esc(cover(p, d))}')"></div><div class="wrap">

        <div class="pp-meta">${p.category ? `<span class="pcat static">${esc(p.category)}</span>` : ''}${p.date ? `<span>${ic('calendar')} ${esc(p.date)}</span>` : ''}</div>
        <h1>${esc(String(p.title || '').trim())}</h1>${p.summary ? `<p class="lead">${esc(p.summary)}</p>` : ''}
        <div class="tags">${(p.tools || []).map(t => `<span class="tag lg">${esc(t)}</span>`).join('')}</div>
        ${links || files.length ? `<div class="row">${links}${files.length ? `<button class="btn btn-ghost" data-go-files>${ic('download')} Files (${files.length})</button>` : ''}</div>` : ''}
      </div></div>

          </div>
